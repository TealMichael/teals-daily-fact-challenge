<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#111827; }
  * { box-sizing:border-box; }
  body { margin:0; padding:2px 2px 12px; background:transparent; }
  .wrap { max-width:540px; margin:0 auto; }
  .topline { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:2px 2px 8px; color:#4b5563; font-size:13px; font-weight:750; }
  .track { height:8px; border-radius:999px; overflow:hidden; background:#e5e7eb; margin:0 2px 12px; }
  .fill { height:100%; background:#0f766e; transition:width .2s ease; }
  .fact { text-align:center; font-size:42px; font-weight:950; letter-spacing:-.03em; margin:9px 0 12px; }
  .context { border:1px solid #d1fae5; background:#f0fdfa; border-radius:14px; padding:10px 12px; margin:5px 0 10px; font-size:14px; line-height:1.35; }
  .feedback { border-radius:14px; padding:10px 12px; margin:7px 0; font-size:15px; font-weight:800; }
  .feedback.bad { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  .feedback.good { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; }
  .coach-card { border:1px solid #99f6e4; background:#f8fffe; border-radius:20px; padding:14px 12px 13px; margin:8px 0 12px; overflow:hidden; }
  .coach-eyebrow { text-align:center; color:#0f766e; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  .coach-title { text-align:center; font-size:24px; font-weight:950; margin:3px 0 5px; }
  .coach-rel { text-align:center; font-size:15px; line-height:1.35; color:#374151; margin:0 auto 9px; max-width:440px; }
  .coach-array-shell { display:flex; justify-content:center; margin:8px 0 10px; }
  .coach-array { display:grid; gap:4px; justify-content:center; align-items:center; padding:4px; }
  .coach-cell { width:12px; height:12px; border-radius:4px; background:#0f766e; opacity:0; transform:scale(.55); animation:cellIn .26s ease forwards; animation-delay:var(--delay); }
  .coach-cell.part-a { background:#f97316; }
  .coach-cell.part-b { background:#7c3aed; }
  .coach-cell.removed { background:#9ca3af; animation:cellIn .26s ease forwards, fadeRemoved .45s ease forwards; animation-delay:var(--delay), calc(var(--delay) + .65s); }
  @keyframes cellIn { to { opacity:1; transform:scale(1); } }
  @keyframes fadeRemoved { to { opacity:.22; transform:scale(.82); } }
  .legend { display:flex; flex-wrap:wrap; justify-content:center; gap:8px 14px; margin:3px 0 9px; color:#4b5563; font-size:12px; font-weight:750; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .swatch { width:10px; height:10px; border-radius:3px; display:inline-block; }
  .swatch.a { background:#f97316; } .swatch.b { background:#7c3aed; } .swatch.r { background:#9ca3af; opacity:.45; }
  .coach-step { border-top:1px solid #ccfbf1; padding-top:11px; margin-top:7px; text-align:center; }
  .step-chip { display:inline-block; background:#ccfbf1; color:#115e59; border-radius:999px; padding:4px 9px; font-size:12px; font-weight:900; margin-bottom:5px; }
  .anchor-prompt { font-size:14px; color:#4b5563; font-weight:750; }
  .anchor-fact { font-size:30px; font-weight:950; margin:4px 0 7px; }
  .anchor-miss { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:12px; padding:8px 10px; font-size:13px; font-weight:800; margin:6px 0 8px; }
  .equation-stack { display:grid; gap:7px; max-width:390px; margin:10px auto 3px; }
  .equation { border-radius:13px; padding:9px 10px; text-align:center; font-size:20px; font-weight:900; background:#fff; border:1px solid #d1d5db; }
  .equation.anchor { border-color:#fdba74; color:#c2410c; background:#fff7ed; }
  .equation.second { border-color:#c4b5fd; color:#6d28d9; background:#f5f3ff; }
  .equation.combine { border:2px solid #5eead4; color:#0f766e; background:#f0fdfa; font-size:23px; }
  .equation.final { border:none; background:#0f766e; color:#fff; font-size:27px; }
  .prompt { text-align:center; font-size:16px; font-weight:850; margin:9px 0 5px; }
  .display { height:56px; display:flex; align-items:center; justify-content:center; border:2px solid #99f6e4; border-radius:16px; background:#fff; font-size:29px; font-weight:950; color:#111827; margin:4px 0 9px; }
  .display.empty { color:#9ca3af; font-size:17px; font-weight:750; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  button { min-height:54px; border:1px solid #d1d5db; border-radius:15px; background:#fff; color:#111827; font-size:23px; font-weight:900; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button:active { background:#f3f4f6; transform:translateY(1px); }
  .back { color:#4b5563; background:#f9fafb; }
  .submit { background:#0f766e; color:#fff; border-color:#0f766e; }
  .submit:active { background:#115e59; }
  .continue { width:100%; background:#0f766e; color:#fff; border-color:#0f766e; margin-top:11px; font-size:17px; min-height:50px; }
  .error { min-height:18px; margin-top:5px; text-align:center; color:#b91c1c; font-size:13px; font-weight:750; }
  .hint { margin-top:2px; text-align:center; color:#6b7280; font-size:12px; }
  .retry-recap { border:1px solid #99f6e4; background:#f0fdfa; border-radius:14px; padding:9px 11px; text-align:center; color:#115e59; font-weight:850; margin:5px 0 9px; }
  .done { text-align:center; border:1px solid #99f6e4; background:#f0fdfa; border-radius:18px; padding:20px 14px; margin-top:8px; }
  .done .big { font-size:25px; font-weight:950; }
  .done .small { color:#4b5563; margin-top:4px; font-size:14px; }
  @media (max-width:420px) {
    .fact { font-size:37px; }
    button { min-height:51px; }
    .coach-cell { width:10px; height:10px; gap:3px; }
    .coach-title { font-size:22px; }
    .anchor-fact { font-size:28px; }
  }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
(() => {
  let args = {};
  let initialized = false;
  let items = [];
  let mode = 'focus';
  let sessionKey = '';
  let index = 0;
  let phase = 'question';
  let digits = '';
  let events = [];
  let itemStartedAt = Date.now();
  let submitted = false;
  let lastHeight = 0;
  let anchorMissed = false;
  let retryMissed = false;

  function post(type, extra={}) { window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), '*'); }
  function ready() { post('streamlit:componentReady', {apiVersion:1}); }
  function setHeight() {
    requestAnimationFrame(() => {
      const height = Math.ceil(document.documentElement.scrollHeight + 8);
      if (height !== lastHeight) { lastHeight = height; post('streamlit:setFrameHeight', {height}); }
    });
  }
  function setValue(value) { post('streamlit:setComponentValue', {value, dataType:'json'}); }
  function storageId() { return 'tdfc-guided:' + sessionKey; }
  function saveLocal() {
    if (!sessionKey) return;
    try { sessionStorage.setItem(storageId(), JSON.stringify({index, phase, digits, events, itemStartedAt, submitted, anchorMissed, retryMissed})); } catch (_) {}
  }
  function loadLocal() {
    if (!sessionKey) return false;
    try {
      const raw = sessionStorage.getItem(storageId());
      if (!raw) return false;
      const data = JSON.parse(raw);
      index = Number.isInteger(data.index) ? data.index : 0;
      phase = typeof data.phase === 'string' ? data.phase : 'question';
      if (phase === 'teach') phase = 'coach';
      digits = typeof data.digits === 'string' ? data.digits : '';
      events = Array.isArray(data.events) ? data.events : [];
      itemStartedAt = Number(data.itemStartedAt) || Date.now();
      submitted = !!data.submitted;
      anchorMissed = !!data.anchorMissed;
      retryMissed = !!data.retryMissed;
      return true;
    } catch (_) { return false; }
  }
  function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }
  function currentItem() { return items[index] || null; }
  function elapsedSeconds() { return Math.max(0, (Date.now() - itemStartedAt) / 1000); }
  function eventId(item, attemptNumber) { return `${sessionKey}:${item.activity_index}:${attemptNumber}`; }
  function attemptsFor(item) { return events.filter(e => Number(e.activity_index) === Number(item.activity_index)); }
  function coach(item) { return item && item.coach && typeof item.coach === 'object' ? item.coach : null; }

  function progressMarkup() {
    const total = items.length || 1;
    const complete = Math.min(index, total);
    const pct = Math.round((complete / total) * 100);
    return `<div class="topline"><span>${escapeHtml(args.step_label || '')}</span><span>${Math.min(index+1,total)} of ${total}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
  }

  function keypadMarkup() {
    const display = digits || 'Tap your answer';
    return `<div class="display ${digits ? '' : 'empty'}" aria-live="polite">${escapeHtml(display)}</div>
      <div class="pad" aria-label="Number pad">
        <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
        <button type="button" id="back" class="back" aria-label="Delete last digit">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="submit" class="submit">✓</button>
      </div><div id="error" class="error"></div><div class="hint">Tap the numbers, then ✓. A physical keyboard works too.</div>`;
  }

  function coachArrayMarkup(item) {
    const p = coach(item);
    if (!p) return '';
    const rows = Number(p.visual_groups || item.a);
    const cols = Number(p.size || item.b);
    const modeName = String(p.visual_mode || 'direct');
    let cells = '';
    for (let r=0; r<rows; r++) {
      for (let c=0; c<cols; c++) {
        let cls = 'coach-cell';
        if (modeName === 'split_add') cls += r < Number(p.first_groups || 0) ? ' part-a' : ' part-b';
        else if (modeName === 'split_subtract') cls += r < Number(p.groups || 0) ? ' part-a' : ' removed';
        const delay = Math.min(520, r * 58 + c * 4);
        cells += `<span class="${cls}" style="--delay:${delay}ms"></span>`;
      }
    }
    let legend = '';
    if (modeName === 'split_add') {
      legend = `<div class="legend"><span><i class="swatch a"></i>${p.first_groups} groups</span><span><i class="swatch b"></i>${p.second_groups} ${Number(p.second_groups) === 1 ? 'group' : 'groups'}</span></div>`;
    } else if (modeName === 'split_subtract') {
      legend = `<div class="legend"><span><i class="swatch a"></i>${p.groups} groups we keep</span><span><i class="swatch r"></i>${p.second_groups} ${Number(p.second_groups) === 1 ? 'group' : 'groups'} taken away</span></div>`;
    }
    return `<div class="coach-array-shell"><div class="coach-array" style="grid-template-columns:repeat(${cols},12px)">${cells}</div></div>${legend}`;
  }

  function coachShell(item, inner='') {
    const p = coach(item);
    if (!p) return '';
    return `<div class="coach-card"><div class="coach-eyebrow">See it · Connect it · Solve it</div><div class="coach-title">Let's build ${item.a} × ${item.b}</div><div class="coach-rel">${escapeHtml(p.relationship || '')}</div>${coachArrayMarkup(item)}${inner}</div>`;
  }

  function coachPhaseMarkup(item) {
    const p = coach(item);
    if (!p) {
      return `<div class="feedback bad">Not yet — ${item.a} × ${item.b} = ${item.product}.</div><div class="retry-recap">Use the array and strategy, then try the fact again.</div><button id="to-retry" class="continue" type="button">Now try ${item.a} × ${item.b} again →</button>`;
    }
    let inner = '';
    if (p.needs_anchor) {
      inner += `<div class="coach-step"><div class="step-chip">YOUR TURN</div><div class="anchor-prompt">${escapeHtml(p.anchor_prompt || 'Start with an easier anchor fact')}</div><div class="anchor-fact">${p.anchor_a} × ${p.anchor_b} = ?</div>`;
      if (anchorMissed) inner += `<div class="anchor-miss">Not yet — ${p.anchor_a} × ${p.anchor_b} = ${p.anchor_answer}. Enter ${p.anchor_answer} to continue.</div>`;
      inner += keypadMarkup() + `</div>`;
    } else {
      inner += `<div class="coach-step"><div class="step-chip">NOTICE THE RELATIONSHIP</div><div class="anchor-prompt">${escapeHtml(p.direct_message || p.combine_equation || '')}</div><div class="equation-stack"><div class="equation combine">${escapeHtml(p.combine_equation || p.final_equation || '')}</div></div><button id="to-retry" class="continue" type="button">Now try ${item.a} × ${item.b} again →</button></div>`;
    }
    return `<div class="feedback bad">Not yet — let's use a relationship instead of counting.</div>${coachShell(item, inner)}`;
  }

  function combineMarkup(item) {
    const p = coach(item);
    if (!p) return `<button id="to-retry" class="continue" type="button">Now try it again →</button>`;
    const anchorEq = p.needs_anchor ? `${p.anchor_a} × ${p.anchor_b} = ${p.anchor_answer}` : '';
    let eqs = '';
    if (anchorEq) eqs += `<div class="equation anchor">✓ ${escapeHtml(anchorEq)}</div>`;
    if (p.second_equation) eqs += `<div class="equation second">${escapeHtml(p.second_equation)}</div>`;
    if (p.combine_equation) eqs += `<div class="equation combine">${escapeHtml(p.combine_equation)}</div>`;
    eqs += `<div class="equation final">${escapeHtml(p.final_equation || `${item.a} × ${item.b} = ${item.product}`)}</div>`;
    const inner = `<div class="coach-step"><div class="step-chip">PUT THE PARTS TOGETHER</div><div class="equation-stack">${eqs}</div><button id="to-retry" class="continue" type="button">Now try ${item.a} × ${item.b} again →</button></div>`;
    return `<div class="feedback good">Nice — you found the anchor fact!</div>${coachShell(item, inner)}`;
  }

  function retryMarkup(item) {
    const p = coach(item);
    const recap = p ? (p.combine_equation || p.final_equation) : `${item.a} × ${item.b} = ${item.product}`;
    return `${retryMissed ? `<div class="feedback bad">Not yet — look back at the relationship and try once more.</div>` : ''}<div class="retry-recap">Remember: ${escapeHtml(recap)}</div><div class="prompt">Now you try it: ${item.a} × ${item.b} = ?</div>${keypadMarkup()}`;
  }

  function render() {
    const root = document.getElementById('root');
    const item = currentItem();
    if (!item) {
      root.innerHTML = `<div class="done"><div class="big">✓ ${escapeHtml(args.done_title || 'Step complete!')}</div><div class="small">Saving your work…</div></div>`;
      setHeight(); submitSession(); return;
    }
    let body = progressMarkup();
    if (mode === 'fix') body += `<div class="context"><strong>Daily miss:</strong> You answered ${escapeHtml(item.original_answer)}.<br><strong>${item.a} × ${item.b}</strong> is worth learning, not just memorizing.</div>`;
    if (phase === 'coach' || phase === 'teach') body += coachPhaseMarkup(item);
    else if (phase === 'combine') body += combineMarkup(item);
    else if (phase === 'retry') body += retryMarkup(item);
    else body += `<div class="fact">${item.a} × ${item.b}</div>${keypadMarkup()}`;
    root.innerHTML = body;
    bindControls(); setHeight();
  }

  function bindControls() {
    document.querySelectorAll('[data-digit]').forEach(btn => btn.addEventListener('click', () => addDigit(btn.dataset.digit)));
    const back = document.getElementById('back'); if (back) back.addEventListener('click', erase);
    const submit = document.getElementById('submit'); if (submit) submit.addEventListener('click', submitAnswer);
    const next = document.getElementById('to-retry'); if (next) next.addEventListener('click', () => { phase='retry'; digits=''; retryMissed=false; itemStartedAt=Date.now(); saveLocal(); render(); });
  }
  function addDigit(d) {
    if (submitted || digits.length >= 3) return;
    digits += d;
    if (digits.length > 1) digits = digits.replace(/^0+/, '') || '0';
    saveLocal(); render();
  }
  function erase() { if (!submitted) { digits = digits.slice(0,-1); saveLocal(); render(); } }

  function recordOriginalAttempt(item, value, isRetry) {
    const prior = attemptsFor(item).length;
    events.push({
      client_event_id:eventId(item, prior + 1), activity_index:Number(item.activity_index),
      a:Number(item.a), b:Number(item.b), student_answer:value,
      response_seconds:Number(elapsedSeconds().toFixed(3)), is_retry:!!isRetry
    });
  }

  function submitAnswer() {
    if (submitted) return;
    const value = Number(digits);
    const error = document.getElementById('error');
    if (!digits || !Number.isInteger(value) || value < 0 || value > 200) { if (error) error.textContent='Enter a whole-number answer.'; return; }
    const item = currentItem();
    const p = coach(item);

    // Scaffolded anchor retrieval is deliberately NOT sent as mastery evidence.
    if (phase === 'coach' || phase === 'teach') {
      if (p && p.needs_anchor) {
        digits = '';
        if (value === Number(p.anchor_answer)) { anchorMissed=false; phase='combine'; }
        else { anchorMissed=true; }
        saveLocal(); render(); return;
      }
      phase='retry'; digits=''; saveLocal(); render(); return;
    }

    const isRetry = phase === 'retry' || mode === 'fix' || !!item.first_already_recorded;
    recordOriginalAttempt(item, value, isRetry);
    digits = '';
    const correct = value === Number(item.product);
    if (correct) {
      index += 1;
      const next = currentItem();
      phase = next ? (next.start_state || (mode === 'fix' ? 'coach' : 'question')) : 'done';
      if (phase === 'teach') phase='coach';
      anchorMissed=false; retryMissed=false; itemStartedAt=Date.now();
    } else if (phase === 'retry') {
      retryMissed=true; itemStartedAt=Date.now();
    } else {
      phase='coach'; anchorMissed=false; retryMissed=false; itemStartedAt=Date.now();
    }
    saveLocal(); render();
  }

  function submitSession() {
    if (submitted) return;
    submitted=true; saveLocal();
    const nonce=`${sessionKey}:${Date.now()}:${events.length}`;
    setValue({submitted:true, mode, session_key:sessionKey, nonce, events});
  }

  function initialize(newArgs) {
    args=newArgs || {};
    mode=args.mode === 'fix' ? 'fix' : 'focus';
    sessionKey=String(args.session_key || 'session');
    items=Array.isArray(args.items) ? args.items : [];
    if (!loadLocal()) {
      index=0;
      phase=items[0] ? (items[0].start_state || (mode === 'fix' ? 'coach' : 'question')) : 'done';
      if (phase === 'teach') phase='coach';
      digits=''; events=[]; itemStartedAt=Date.now(); submitted=false; anchorMissed=false; retryMissed=false; saveLocal();
    }
    initialized=true; render();
    if (submitted && events.length) setTimeout(() => setValue({submitted:true, mode, session_key:sessionKey, nonce:`${sessionKey}:replay:${Date.now()}`, events}), 40);
  }

  document.addEventListener('keydown', event => {
    if (!initialized || submitted) return;
    if (event.key >= '0' && event.key <= '9') { event.preventDefault(); addDigit(event.key); }
    else if (event.key === 'Backspace' || event.key === 'Delete') { event.preventDefault(); erase(); }
    else if (event.key === 'Enter') { event.preventDefault(); submitAnswer(); }
  });

  window.addEventListener('message', event => {
    if (!event.data || event.data.type !== 'streamlit:render') return;
    const newArgs=event.data.args || {};
    const newKey=String(newArgs.session_key || 'session');
    if (!initialized || newKey !== sessionKey) initialize(newArgs);
    else { args=newArgs; setHeight(); }
  });
  if (window.ResizeObserver) new ResizeObserver(setHeight).observe(document.documentElement);
  ready();
})();
</script>
</body>
</html>
