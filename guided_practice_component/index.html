<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root {
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#111827;
    --teal:#0f766e;
    --teal2:#14b8a6;
    --teal-bg:#f0fdfa;
    --orange:#f97316;
    --orange-bg:#fff7ed;
    --purple:#7c3aed;
    --purple-bg:#f5f3ff;
    --red:#b91c1c;
    --red-bg:#fef2f2;
    --muted:#6b7280;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:2px 2px 14px; background:transparent; }
  .wrap { max-width:540px; margin:0 auto; }
  .topline { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:2px 2px 8px; color:#4b5563; font-size:13px; font-weight:800; }
  .track { height:8px; border-radius:999px; overflow:hidden; background:#e5e7eb; margin:0 2px 12px; }
  .fill { height:100%; background:var(--teal); transition:width .2s ease; }
  .fact { text-align:center; font-size:42px; font-weight:950; letter-spacing:-.03em; margin:9px 0 12px; }
  .context { border:1px solid #d1fae5; background:var(--teal-bg); border-radius:14px; padding:9px 12px; margin:5px 0 9px; text-align:center; }
  .context .missed { font-size:18px; font-weight:950; }
  .context .said { margin-top:2px; color:#4b5563; font-size:13px; font-weight:750; }
  .feedback { border-radius:14px; padding:10px 12px; margin:7px 0; font-size:16px; font-weight:900; text-align:center; }
  .feedback.bad { background:var(--red-bg); border:1px solid #fecaca; color:#991b1b; }
  .feedback.good { background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; animation:goodPop .35s ease both; }
  @keyframes goodPop { 0%{transform:scale(.96);opacity:.25} 75%{transform:scale(1.015)} 100%{transform:scale(1);opacity:1} }

  .coach-card { border:1px solid #99f6e4; background:#f8fffe; border-radius:20px; padding:13px 12px 14px; margin:8px 0 12px; overflow:hidden; text-align:center; }
  .stage-row { display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-bottom:7px; }
  .stage-chip { border-radius:999px; padding:4px 9px; font-size:11px; font-weight:950; letter-spacing:.04em; background:#e5e7eb; color:#6b7280; opacity:.38; transform:scale(.94); transition:opacity .24s ease, transform .24s ease, background .24s ease, color .24s ease; }
  .coach-card.seq-see .stage-chip.see,
  .coach-card.seq-break .stage-chip.see,
  .coach-card.seq-turn .stage-chip.see,
  .coach-card.seq-break .stage-chip.break,
  .coach-card.seq-turn .stage-chip.break,
  .coach-card.seq-turn .stage-chip.turn { opacity:1; transform:scale(1); background:#ccfbf1; color:#115e59; }
  .coach-title { text-align:center; font-size:31px; font-weight:950; letter-spacing:-.025em; margin:1px 0 3px; }
  .visual-caption { color:#374151; font-size:15px; font-weight:850; margin-bottom:4px; }
  .same-fact { display:inline-block; margin:1px 0 5px; padding:3px 8px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:12px; font-weight:850; }

  .watch-controls { display:flex; justify-content:center; align-items:center; gap:8px; min-height:48px; margin:7px 0 4px; }
  .watch-btn { min-height:44px; padding:0 24px; border-radius:999px; border:1px solid var(--teal); background:var(--teal); color:#fff; font-size:16px; font-weight:950; }
  .watch-btn.secondary { display:none; background:#fff; color:var(--teal); }
  .coach-card.sequence-complete .watch-btn.primary { display:none; }
  .coach-card.sequence-complete .watch-btn.secondary { display:inline-block; }
  .coach-card.sequence-playing .watch-btn.primary { opacity:.6; pointer-events:none; }
  .watch-note { font-size:11px; color:#64748b; font-weight:750; margin-top:-1px; }

  .coach-array-shell { display:flex; justify-content:center; margin:8px 0 7px; min-height:28px; }
  .coach-array { display:grid; gap:4px; justify-content:center; align-items:center; padding:4px; }
  .coach-cell { width:12px; height:12px; border-radius:4px; background:var(--teal); opacity:0; transform:scale(.62); transition:opacity .22s ease, transform .22s ease, background-color .38s ease, filter .28s ease; transition-delay:0ms; }
  .coach-card.seq-see .coach-cell { opacity:1; transform:scale(1); transition-delay:var(--delay); }

  /* The whole array appears first. Only then does it visibly transform. */
  .coach-card.seq-break .coach-cell { opacity:1; transform:scale(1); transition-delay:0ms; }
  .coach-card.seq-break .coach-cell.part-a { background:var(--orange); transform:scale(1.04); }
  .coach-card.seq-break .coach-cell.part-b { background:var(--purple); transform:scale(1.04); }
  .coach-card.seq-break .coach-cell.removed { background:#9ca3af; opacity:.22; transform:scale(.84); }

  .coach-card.combine-view .coach-cell { opacity:1; transform:scale(1); transition-delay:0ms; }
  .coach-card.combine-view .coach-cell.part-a { background:var(--orange); }
  .coach-card.combine-view .coach-cell.part-b { background:var(--purple); }
  .coach-card.combine-view .coach-cell.removed { background:#9ca3af; opacity:.22; transform:scale(.84); }
  .coach-card.combine-view.pulse-a .coach-cell.part-a { animation:pulseA .52s ease both; }
  .coach-card.combine-view.pulse-b .coach-cell.part-b { animation:pulseB .52s ease both; }
  @keyframes pulseA { 50%{transform:scale(1.16);filter:brightness(1.08)} }
  @keyframes pulseB { 50%{transform:scale(1.16);filter:brightness(1.08)} }

  .group-equation { display:flex; justify-content:center; align-items:center; gap:6px; flex-wrap:wrap; min-height:30px; margin:4px 0 4px; font-size:15px; font-weight:900; }
  .part-pill { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 9px; opacity:0; transform:translateY(5px); transition:opacity .28s ease, transform .28s ease; }
  .part-pill.a { color:#c2410c; background:var(--orange-bg); }
  .part-pill.b { color:#6d28d9; background:var(--purple-bg); }
  .part-pill.r { color:#4b5563; background:#f3f4f6; }
  .coach-card.seq-break .part-pill { opacity:1; transform:translateY(0); }
  .build-explain, .direct-cue {
    opacity:0; transform:translateY(5px); transition:opacity .3s ease, transform .3s ease;
    margin:5px auto 2px; max-width:420px; text-align:center; font-size:14px; font-weight:900; color:#374151;
  }
  .build-explain strong { color:var(--teal); }
  .direct-cue { background:#f8fafc; border-radius:12px; padding:7px 9px; }
  .coach-card.seq-break .build-explain, .coach-card.seq-break .direct-cue,
  .coach-card.combine-view .build-explain, .coach-card.combine-view .direct-cue {
    opacity:1; transform:translateY(0);
  }

  /* v2.8.3+: one meaningful touch for take-away strategies. */
  .remove-explain { display:none; margin:8px auto 3px; max-width:420px; text-align:center; }
  .coach-card.remove-ready .remove-explain { display:block; animation:removePromptPop .28s ease both; }
  .remove-start { font-size:18px; font-weight:950; color:#0f766e; margin-bottom:5px; }
  .remove-leaves { font-size:14px; font-weight:900; color:#4b5563; margin-top:5px; }
  .remove-action {
    display:block; margin:5px auto 3px; max-width:390px; border:2px dashed #c4b5fd;
    background:#faf5ff; color:#5b21b6; border-radius:16px; padding:10px 12px;
    font-size:14px; font-weight:950; letter-spacing:.01em;
  }
  .remove-action.done { border-style:solid; border-color:#86efac; background:#f0fdf4; color:#166534; }
  @keyframes removePromptPop { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }
  .coach-card.remove-ready .coach-cell.removed {
    background:#8b5cf6; opacity:1; transform:scale(1.08); cursor:pointer; position:relative;
    box-shadow:0 0 0 2px rgba(124,58,237,.20); touch-action:manipulation;
  }
  .coach-card.remove-ready .coach-cell.removed::after {
    content:""; position:absolute; inset:-5px; border-radius:7px;
  }
  .coach-cell.removed.removed-by-tap {
    opacity:.08 !important; transform:translateX(22px) scale(.72) !important; filter:grayscale(1);
    pointer-events:none; box-shadow:none !important;
  }
  .coach-card.remove-ready .part-pill.r { outline:2px solid #c4b5fd; outline-offset:1px; }
  .coach-card.user-removed .part-pill.r { opacity:.45; text-decoration:line-through; }

  .coach-question { display:none; border-top:1px solid #ccfbf1; padding-top:11px; margin-top:7px; text-align:center; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .3s ease, transform .3s ease; }
  .coach-card.seq-turn .coach-question,
  .coach-card.combine-view .coach-question { display:block; opacity:1; transform:translateY(0); pointer-events:auto; }
  .your-turn { display:inline-block; background:#ccfbf1; color:#115e59; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:950; margin-bottom:3px; }
  .micro-prompt { font-size:13px; color:#4b5563; font-weight:800; }
  .anchor-fact { font-size:34px; font-weight:950; margin:2px 0 6px; }
  .anchor-miss { display:none; background:var(--red-bg); border:1px solid #fecaca; color:#991b1b; border-radius:12px; padding:8px 10px; font-size:13px; font-weight:850; margin:6px 0 8px; }
  .anchor-miss.show { display:block; animation:shake .25s ease; }
  @keyframes shake { 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} }

  details.why { margin:8px auto 0; max-width:430px; color:#4b5563; font-size:12px; text-align:left; }
  details.why summary { cursor:pointer; text-align:center; font-weight:800; color:#64748b; }
  details.why div { margin-top:5px; padding:7px 9px; background:#f8fafc; border-radius:10px; line-height:1.35; }

  .equation-stack { display:grid; gap:7px; max-width:390px; margin:10px auto 3px; }
  .equation { border-radius:13px; padding:9px 10px; text-align:center; font-size:21px; font-weight:950; background:#fff; border:1px solid #d1d5db; opacity:0; transform:translateY(8px) scale(.98); transition:opacity .32s ease, transform .32s ease; }
  .equation.anchor { border-color:#fdba74; color:#c2410c; background:var(--orange-bg); }
  .equation.second { border-color:#c4b5fd; color:#6d28d9; background:var(--purple-bg); }
  .equation.combine { border:2px solid #5eead4; color:var(--teal); background:var(--teal-bg); font-size:24px; }
  .equation.final { border:none; background:var(--teal); color:#fff; font-size:29px; }
  .coach-card.combine-view.eq-step-1 .equation.anchor,
  .coach-card.combine-view.eq-step-2 .equation.anchor,
  .coach-card.combine-view.eq-step-3 .equation.anchor,
  .coach-card.combine-view.eq-step-4 .equation.anchor,
  .coach-card.combine-view.eq-step-2 .equation.second,
  .coach-card.combine-view.eq-step-3 .equation.second,
  .coach-card.combine-view.eq-step-4 .equation.second,
  .coach-card.combine-view.eq-step-3 .equation.combine,
  .coach-card.combine-view.eq-step-4 .equation.combine,
  .coach-card.combine-view.eq-step-4 .equation.final { opacity:1; transform:translateY(0) scale(1); }
  .coach-card.combine-view.eq-step-4 .equation.final { animation:finalPop .48s cubic-bezier(.2,.9,.25,1.35) both; }
  @keyframes finalPop { 0%{opacity:0;transform:scale(.72)} 75%{opacity:1;transform:scale(1.07)} 100%{opacity:1;transform:scale(1)} }
  .combine-action { opacity:0; visibility:hidden; transform:translateY(6px); transition:opacity .28s ease, transform .28s ease; }
  .coach-card.combine-view.action-ready .combine-action,
  .coach-card.teach-view.action-ready .combine-action { opacity:1; visibility:visible; transform:translateY(0); }
  .coach-card.teach-view.direct-step-1 .equation.combine,
  .coach-card.teach-view.direct-step-2 .equation.combine,
  .coach-card.teach-view.direct-step-2 .equation.final { opacity:1; transform:translateY(0) scale(1); }
  .coach-card.teach-view.direct-step-2 .equation.final { animation:finalPop .48s cubic-bezier(.2,.9,.25,1.35) both; }

  .prompt { text-align:center; font-size:16px; font-weight:900; margin:7px 0 5px; }
  .retry-boss { text-align:center; border:1px solid #99f6e4; background:var(--teal-bg); border-radius:18px; padding:12px 10px 9px; margin:6px 0 9px; }
  .boss-chip { display:inline-block; border-radius:999px; background:#ccfbf1; color:#115e59; font-size:12px; font-weight:950; padding:4px 10px; }
  .boss-fact { font-size:36px; font-weight:950; margin:3px 0 2px; }
  .boss-hint { color:#64748b; font-size:12px; font-weight:750; }
  .retry-feedback { display:none; margin:6px 0; border-radius:12px; padding:8px 9px; background:var(--red-bg); color:#991b1b; font-size:13px; font-weight:850; }
  .retry-feedback.show { display:block; animation:shake .25s ease; }

  .display { height:56px; display:flex; align-items:center; justify-content:center; border:2px solid #99f6e4; border-radius:16px; background:#fff; font-size:29px; font-weight:950; color:#111827; margin:4px 0 9px; transition:border-color .15s, transform .15s; }
  .display.empty { color:#9ca3af; font-size:17px; font-weight:750; }
  .display.flash-good { border-color:#34d399; transform:scale(1.02); background:#ecfdf5; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  button { min-height:54px; border:1px solid #d1d5db; border-radius:15px; background:#fff; color:#111827; font-size:23px; font-weight:900; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button:active { background:#f3f4f6; transform:translateY(1px); }
  .back { color:#4b5563; background:#f9fafb; }
  .submit { background:var(--teal); color:#fff; border-color:var(--teal); }
  .submit:active { background:#115e59; }
  .continue { width:100%; background:var(--teal); color:#fff; border-color:var(--teal); margin-top:11px; font-size:18px; min-height:51px; }
  .error { min-height:18px; margin-top:5px; text-align:center; color:#b91c1c; font-size:13px; font-weight:750; }
  .hint { margin-top:2px; text-align:center; color:#6b7280; font-size:11px; }
  .done { text-align:center; border:1px solid #99f6e4; background:var(--teal-bg); border-radius:18px; padding:20px 14px; margin-top:8px; }
  .done .big { font-size:25px; font-weight:950; }
  .done .small { color:#4b5563; margin-top:4px; font-size:14px; }

  @media (max-width:420px) {
    .fact { font-size:37px; }
    button { min-height:51px; }
    .coach-cell { width:10px; height:10px; }
    .coach-title { font-size:28px; }
    .anchor-fact { font-size:31px; }
    .coach-card { padding-left:9px; padding-right:9px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    /* Accessibility: remove motion, but JS still reveals each math stage in order. */
    .coach-cell,.coach-question,.part-pill,.equation,.combine-action,.stage-chip { transform:none !important; }
  }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
(() => {
  let args = {};
  let initialized = false;
  let items = [];
  let mode = 'focus';
  let sessionKey = '';
  let index = 0;
  let phase = 'question';
  let digits = '';
  let events = [];
  let itemStartedAt = Date.now();
  let submitted = false;
  let lastHeight = 0;
  let anchorMissed = false;
  let retryMissed = false;
  let coachSequenceReady = true;
  let coachSequenceTimers = [];
  let removedRowsTapped = new Set();

  function post(type, extra={}) { window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), '*'); }
  function ready() { post('streamlit:componentReady', {apiVersion:1}); }
  function setHeight() {
    requestAnimationFrame(() => {
      const height = Math.ceil(document.documentElement.scrollHeight + 8);
      if (height !== lastHeight) { lastHeight = height; post('streamlit:setFrameHeight', {height}); }
    });
  }
  function setValue(value) { post('streamlit:setComponentValue', {value, dataType:'json'}); }
  function storageId() { return 'tdfc-guided:' + sessionKey; }
  function saveLocal() {
    if (!sessionKey) return;
    try { sessionStorage.setItem(storageId(), JSON.stringify({index, phase, digits, events, itemStartedAt, submitted, anchorMissed, retryMissed})); } catch (_) {}
  }
  function loadLocal() {
    if (!sessionKey) return false;
    try {
      const raw = sessionStorage.getItem(storageId());
      if (!raw) return false;
      const data = JSON.parse(raw);
      index = Number.isInteger(data.index) ? data.index : 0;
      phase = typeof data.phase === 'string' ? data.phase : 'question';
      if (phase === 'teach') phase = 'coach';
      digits = typeof data.digits === 'string' ? data.digits : '';
      events = Array.isArray(data.events) ? data.events : [];
      itemStartedAt = Number(data.itemStartedAt) || Date.now();
      submitted = !!data.submitted;
      anchorMissed = !!data.anchorMissed;
      retryMissed = !!data.retryMissed;
      return true;
    } catch (_) { return false; }
  }
  function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch])); }
  function currentItem() { return items[index] || null; }
  function elapsedSeconds() { return Math.max(0, (Date.now() - itemStartedAt) / 1000); }
  function eventId(item, attemptNumber) { return `${sessionKey}:${item.activity_index}:${attemptNumber}`; }
  function attemptsFor(item) { return events.filter(e => Number(e.activity_index) === Number(item.activity_index)); }
  function coach(item) { return item && item.coach && typeof item.coach === 'object' ? item.coach : null; }

  function progressMarkup() {
    const total = items.length || 1;
    const complete = Math.min(index, total);
    const pct = Math.round((complete / total) * 100);
    return `<div class="topline"><span>${escapeHtml(args.step_label || '')}</span><span>${Math.min(index+1,total)} of ${total}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div>`;
  }

  function keypadMarkup() {
    const display = digits || 'Tap your answer';
    return `<div id="answer-display" class="display ${digits ? '' : 'empty'}" aria-live="polite">${escapeHtml(display)}</div>
      <div class="pad" aria-label="Number pad">
        <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
        <button type="button" id="back" class="back" aria-label="Delete last digit">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="submit" class="submit">✓</button>
      </div><div id="error" class="error"></div><div class="hint">Tap numbers, then ✓</div>`;
  }

  function updateDigitDisplay() {
    const display = document.getElementById('answer-display');
    if (!display) return;
    display.textContent = digits || 'Tap your answer';
    display.classList.toggle('empty', !digits);
    setHeight();
  }

  function coachArrayMarkup(item, view='teach') {
    const p = coach(item);
    if (!p) return '';
    const rows = Number(p.visual_groups || item.a);
    const cols = Number(p.size || item.b);
    const modeName = String(p.visual_mode || 'direct');
    let cells = '';
    for (let r=0; r<rows; r++) {
      for (let c=0; c<cols; c++) {
        let cls = 'coach-cell';
        if (modeName === 'split_add') cls += r < Number(p.first_groups || 0) ? ' part-a' : ' part-b';
        else if (modeName === 'split_subtract') cls += r < Number(p.groups || 0) ? ' part-a' : ' removed';
        const delay = Math.min(420, r * 42 + c * 3);
        const removeAttr = (modeName === 'split_subtract' && r >= Number(p.groups || 0)) ? ` data-remove-row="${r}"` : '';
        cells += `<span class="${cls}"${removeAttr} style="--delay:${delay}ms"></span>`;
      }
    }
    let parts = '';
    if (modeName === 'split_add') {
      parts = `<div class="group-equation"><span class="part-pill a">${p.first_groups} groups</span><span class="part-pill b">${p.second_groups} ${Number(p.second_groups) === 1 ? 'group' : 'groups'}</span></div><div class="build-explain">BUILD ${p.groups} GROUPS: <strong>${p.first_groups} + ${p.second_groups}</strong></div>`;
    } else if (modeName === 'split_subtract') {
      const removeCount = Number(p.second_groups || 1);
      const noun = removeCount === 1 ? 'GROUP' : 'GROUPS';
      const size = Number(p.size || item.b);
      const removedValue = removeCount * size;
      const anchorFirst = (Number(item.a) === size && Number(item.b) === Number(p.groups)) ? size : Number(p.anchor_a);
      const anchorSecond = (anchorFirst === size) ? 10 : Number(p.anchor_b);
      const anchorLine = `${anchorFirst} × ${anchorSecond} = ${p.anchor_answer}`;
      const actionLine = `👆 TAP ${removeCount} ${noun} OF ${size} TO TAKE ${removeCount === 1 ? 'IT' : 'THEM'} AWAY`;
      const leavesLine = `THAT LEAVES ${item.a} × ${item.b}`;
      parts = `<div class="group-equation"><span class="part-pill a">${p.groups} keep</span><span class="part-pill r">${p.second_groups} take away</span></div><div class="remove-explain"><div class="remove-start">START WITH ${anchorLine}</div><div id="remove-action" class="remove-action" data-removed-value="${removedValue}">${actionLine}</div><div id="remove-leaves" class="remove-leaves">${leavesLine}</div></div>`;
    } else {
      const cue = p.direct_message || p.relationship || '';
      if (cue) parts = `<div class="direct-cue">${escapeHtml(cue)}</div>`;
    }
    return `<div class="coach-array-shell"><div class="coach-array" style="grid-template-columns:repeat(${cols},12px)">${cells}</div></div>${parts}`;
  }

  function orientationMarkup(item, p) {
    if (!p) return '';
    const caption = `${p.groups} groups of ${p.size}`;
    if (Number(p.groups) === Number(item.a) && Number(p.size) === Number(item.b)) return `<div class="visual-caption">${caption}</div>`;
    return `<div class="visual-caption">${caption}</div><div class="same-fact">↔ ${p.groups} × ${p.size}</div>`;
  }

  function optionalWhy(p) {
    if (!p || !p.relationship) return '';
    return `<details class="why"><summary>💡 Why?</summary><div>${escapeHtml(p.relationship)}</div></details>`;
  }

  function coachShell(item, inner='', view='teach') {
    const p = coach(item);
    if (!p) return '';
    const stages = p.needs_anchor
      ? `<div class="stage-row"><span class="stage-chip see">SEE IT</span><span class="stage-chip break">BREAK IT</span><span class="stage-chip turn">YOUR TURN</span></div>`
      : `<div class="stage-row"><span class="stage-chip see">SEE IT</span><span class="stage-chip break">BUILD IT</span></div>`;
    const watch = view === 'combine' ? '' : `<div class="watch-controls"><button id="watch-coach" class="watch-btn primary" type="button">▶ WATCH IT</button><button id="replay-coach" class="watch-btn secondary" type="button">↻ REPLAY</button></div>`;
    return `<div class="coach-card ${view === 'combine' ? 'combine-view' : 'teach-view'}" data-learning-sequence="See it · Connect it · Solve it">${stages}<div class="coach-title">${item.a} × ${item.b}</div>${orientationMarkup(item,p)}${watch}${coachArrayMarkup(item,view)}${inner}${optionalWhy(p)}</div>`;
  }

  function anchorDisplay(item, p) {
    if (!p) return {a: 0, b: 0};
    if (String(p.visual_mode || '') === 'split_subtract') {
      const size = Number(p.size || item.b);
      if (Number(item.a) === size && Number(item.b) === Number(p.groups)) return {a:size, b:10};
    }
    return {a:Number(p.anchor_a), b:Number(p.anchor_b)};
  }

  function coachPhaseMarkup(item) {
    const p = coach(item);
    if (!p) {
      return `<div class="feedback bad">Not yet — let's build it!</div><div class="retry-boss"><div class="boss-chip">TRY AGAIN</div><div class="boss-fact">${item.a} × ${item.b} = ?</div></div>${keypadMarkup()}`;
    }
    let inner = '';
    if (p.needs_anchor) {
      const shownAnchor = anchorDisplay(item, p);
      inner = `<div class="coach-question"><div class="your-turn">YOUR TURN 🎯</div><div class="micro-prompt">Start with a fact you know</div><div class="anchor-fact">${shownAnchor.a} × ${shownAnchor.b} = ?</div><div id="anchor-miss" class="anchor-miss ${anchorMissed ? 'show' : ''}">Not yet — ${shownAnchor.a} × ${shownAnchor.b} = ${p.anchor_answer}. Enter ${p.anchor_answer}.</div>${keypadMarkup()}</div>`;
    } else {
      inner = `<div class="coach-question"><div class="your-turn">PUT IT TOGETHER</div><div class="equation-stack"><div class="equation combine">${escapeHtml(p.combine_equation || p.final_equation || '')}</div><div class="equation final">${escapeHtml(p.final_equation || `${item.a} × ${item.b} = ${item.product}`)}</div></div><div class="combine-action"><button id="to-retry" class="continue" type="button">TRY AGAIN →</button></div></div>`;
    }
    return `<div class="feedback bad">Not yet — let's build it!</div>${coachShell(item, inner, 'teach')}`;
  }

  // Legacy regression marker: PUT THE PARTS TOGETHER
  function combineMarkup(item) {
    const p = coach(item);
    if (!p) return `<button id="to-retry" class="continue" type="button">TRY AGAIN →</button>`;
    const shownAnchor = anchorDisplay(item, p);
    const anchorEq = p.needs_anchor ? `${shownAnchor.a} × ${shownAnchor.b} = ${p.anchor_answer}` : '';
    let eqs = '';
    if (anchorEq) eqs += `<div class="equation anchor">✓ ${escapeHtml(anchorEq)}</div>`;
    if (p.second_equation) eqs += `<div class="equation second">${escapeHtml(p.second_equation)}</div>`;
    if (p.combine_equation) eqs += `<div class="equation combine">${escapeHtml(p.combine_equation)}</div>`;
    eqs += `<div class="equation final">${escapeHtml(p.final_equation || `${item.a} × ${item.b} = ${item.product}`)}</div>`;
    const inner = `<div class="coach-question" style="animation-delay:.05s"><div class="your-turn">PUT IT TOGETHER ⚡</div><div class="equation-stack">${eqs}</div><div class="combine-action"><button id="to-retry" class="continue" type="button">TRY AGAIN →</button></div></div>`;
    return `<div class="feedback good">✅ Nice!</div>${coachShell(item, inner, 'combine')}`;
  }

  // Legacy regression marker: Now you try it
  function retryMarkup(item) {
    const p = coach(item);
    const recap = p ? (p.combine_equation || p.final_equation) : `${item.a} × ${item.b} = ${item.product}`;
    return `<div id="retry-feedback" class="retry-feedback ${retryMissed ? 'show' : ''}">Almost — try once more.</div><div class="retry-boss"><div class="boss-chip">🎯 TRY AGAIN</div><div class="boss-fact">${item.a} × ${item.b} = ?</div><div class="boss-hint">${escapeHtml(recap)}</div></div>${keypadMarkup()}`;
  }

  function clearCoachSequenceTimers() {
    coachSequenceTimers.forEach(id => clearTimeout(id));
    coachSequenceTimers = [];
  }
  function later(ms, fn) { coachSequenceTimers.push(setTimeout(fn, ms)); }
  function resetTeachClasses(card) {
    ['seq-see','seq-break','seq-turn','sequence-playing','sequence-complete','direct-step-1','direct-step-2','action-ready','remove-ready','user-removed'].forEach(c => card.classList.remove(c));
    removedRowsTapped = new Set();
    card.querySelectorAll('.removed-by-tap').forEach(cell => cell.classList.remove('removed-by-tap'));
    const removeAction = card.querySelector('#remove-action');
    if (removeAction) removeAction.classList.remove('done');
  }
  function startTeachSequence() {
    const card = document.querySelector('.coach-card.teach-view');
    if (!card) return;
    clearCoachSequenceTimers();
    resetTeachClasses(card);
    coachSequenceReady = false;
    const item = currentItem();
    const p = coach(item);
    const needsAnchor = !!card.querySelector('.anchor-fact');
    const needsRemovalTap = !!(p && String(p.visual_mode || '') === 'split_subtract' && Number(p.second_groups || 0) > 0);
    card.classList.add('sequence-playing');
    setHeight();
    later(180, () => { card.classList.add('seq-see'); setHeight(); });
    later(1350, () => {
      card.classList.add('seq-break');
      if (needsRemovalTap) {
        card.classList.add('remove-ready');
        card.classList.remove('sequence-playing');
      }
      setHeight();
    });
    if (needsRemovalTap) return;
    if (needsAnchor) {
      later(2650, () => {
        card.classList.add('seq-turn','sequence-complete');
        card.classList.remove('sequence-playing');
        coachSequenceReady = true;
        setHeight();
      });
    } else {
      later(2200, () => { card.classList.add('seq-turn','direct-step-1'); setHeight(); });
      later(2950, () => { card.classList.add('direct-step-2'); setHeight(); });
      later(3600, () => {
        card.classList.add('action-ready','sequence-complete');
        card.classList.remove('sequence-playing');
        coachSequenceReady = true;
        setHeight();
      });
    }
  }

  function tapRemoveRow(rowValue) {
    const card = document.querySelector('.coach-card.teach-view');
    const item = currentItem();
    const p = coach(item);
    if (!card || !p || !card.classList.contains('remove-ready')) return;
    const row = String(rowValue);
    if (removedRowsTapped.has(row)) return;
    removedRowsTapped.add(row);
    card.querySelectorAll(`[data-remove-row="${row}"]`).forEach(cell => cell.classList.add('removed-by-tap'));
    const needed = Number(p.second_groups || 1);
    const remaining = Math.max(0, needed - removedRowsTapped.size);
    const prompt = card.querySelector('#remove-action');
    const size = Number(p.size || item.b);
    const removedValue = needed * size;
    const leaves = card.querySelector('#remove-leaves');
    if (prompt) {
      if (remaining > 0) prompt.textContent = `👆 ${remaining} MORE ${remaining === 1 ? `GROUP OF ${size}` : `GROUPS OF ${size}`}`;
      else { prompt.textContent = `✅ YOU TOOK AWAY ${removedValue}`; prompt.classList.add('done'); }
    }
    if (remaining === 0 && leaves) leaves.textContent = `${p.anchor_answer} − ${removedValue} LEAVES ${item.a} × ${item.b}`;
    setHeight();
    if (removedRowsTapped.size >= needed) {
      card.classList.add('user-removed');
      // Give a struggling learner time to notice the removed quantity before the next question appears.
      later(1150, () => {
        card.classList.remove('remove-ready');
        card.classList.add('seq-turn','sequence-complete');
        coachSequenceReady = true;
        setHeight();
      });
    }
  }

  function startCombineSequence() {
    const card = document.querySelector('.coach-card.combine-view');
    if (!card) return;
    clearCoachSequenceTimers();
    card.classList.add('seq-see','seq-break','seq-turn');
    coachSequenceReady = true;
    later(250, () => card.classList.add('pulse-a'));
    later(760, () => card.classList.remove('pulse-a'));
    later(820, () => card.classList.add('eq-step-1'));
    later(1250, () => card.classList.add('pulse-b'));
    later(1750, () => { card.classList.remove('pulse-b'); card.classList.add('eq-step-2'); });
    later(2450, () => card.classList.add('eq-step-3'));
    later(3150, () => card.classList.add('eq-step-4'));
    later(3850, () => { card.classList.add('action-ready'); setHeight(); });
  }
  function prepareCoachSequence() {
    clearCoachSequenceTimers();
    if (phase === 'coach' || phase === 'teach') {
      coachSequenceReady = false;
      return;
    }
    coachSequenceReady = true;
    if (phase === 'combine') later(180, startCombineSequence);
  }

  function render() {
    const root = document.getElementById('root');
    const item = currentItem();
    if (!item) {
      root.innerHTML = `<div class="done"><div class="big">⭐ ${escapeHtml(args.done_title || 'Step complete!')}</div><div class="small">Saving your work…</div></div>`;
      setHeight(); submitSession(); return;
    }
    let body = progressMarkup();
    if (mode === 'fix') body += `<div class="context"><div class="missed">Missed: ${item.a} × ${item.b}</div><div class="said">You said ${escapeHtml(item.original_answer)}</div></div>`;
    if (phase === 'coach' || phase === 'teach') body += coachPhaseMarkup(item);
    else if (phase === 'combine') body += combineMarkup(item);
    else if (phase === 'retry') body += retryMarkup(item);
    else body += `<div class="fact">${item.a} × ${item.b}</div>${keypadMarkup()}`;
    root.innerHTML = body;
    bindControls(); prepareCoachSequence(); setHeight();
  }

  function bindControls() {
    document.querySelectorAll('[data-digit]').forEach(btn => btn.addEventListener('click', () => addDigit(btn.dataset.digit)));
    const back = document.getElementById('back'); if (back) back.addEventListener('click', erase);
    const submit = document.getElementById('submit'); if (submit) submit.addEventListener('click', submitAnswer);
    const next = document.getElementById('to-retry'); if (next) next.addEventListener('click', () => { phase='retry'; digits=''; retryMissed=false; itemStartedAt=Date.now(); saveLocal(); render(); });
    const watch = document.getElementById('watch-coach'); if (watch) watch.addEventListener('click', startTeachSequence);
    const replay = document.getElementById('replay-coach'); if (replay) replay.addEventListener('click', startTeachSequence);
    document.querySelectorAll('[data-remove-row]').forEach(cell => cell.addEventListener('click', () => tapRemoveRow(cell.dataset.removeRow)));
  }
  function addDigit(d) {
    if (submitted || digits.length >= 3) return;
    if ((phase === 'coach' || phase === 'teach') && !coachSequenceReady) return;
    digits += d;
    if (digits.length > 1) digits = digits.replace(/^0+/, '') || '0';
    saveLocal(); updateDigitDisplay();
  }
  function erase() {
    if (submitted) return;
    if ((phase === 'coach' || phase === 'teach') && !coachSequenceReady) return;
    digits = digits.slice(0,-1);
    saveLocal(); updateDigitDisplay();
  }

  function recordOriginalAttempt(item, value, isRetry) {
    const prior = attemptsFor(item).length;
    events.push({
      client_event_id:eventId(item, prior + 1), activity_index:Number(item.activity_index),
      a:Number(item.a), b:Number(item.b), student_answer:value,
      response_seconds:Number(elapsedSeconds().toFixed(3)), is_retry:!!isRetry
    });
  }

  function flashDisplay(kind='good') {
    const display = document.getElementById('answer-display');
    if (!display) return;
    if (kind === 'good') {
      display.classList.add('flash-good');
      setTimeout(() => display.classList.remove('flash-good'), 260);
    }
  }

  function submitAnswer() {
    if (submitted) return;
    if ((phase === 'coach' || phase === 'teach') && !coachSequenceReady) return;
    const value = Number(digits);
    const error = document.getElementById('error');
    if (!digits || !Number.isInteger(value) || value < 0 || value > 200) { if (error) error.textContent='Enter a whole number.'; return; }
    const item = currentItem();
    const p = coach(item);

    // Scaffolded anchor retrieval is deliberately NOT sent as mastery evidence.
    if (phase === 'coach' || phase === 'teach') {
      if (p && p.needs_anchor) {
        if (value === Number(p.anchor_answer)) {
          flashDisplay('good');
          digits=''; anchorMissed=false; phase='combine'; saveLocal();
          setTimeout(render, 180);
        } else {
          digits=''; anchorMissed=true; saveLocal(); updateDigitDisplay();
          const msg=document.getElementById('anchor-miss');
          if (msg) { msg.classList.remove('show'); void msg.offsetWidth; msg.classList.add('show'); }
        }
        return;
      }
      phase='retry'; digits=''; saveLocal(); render(); return;
    }

    const isRetry = phase === 'retry' || mode === 'fix' || !!item.first_already_recorded;
    recordOriginalAttempt(item, value, isRetry);
    const correct = value === Number(item.product);
    digits = '';
    if (correct) {
      flashDisplay('good');
      setTimeout(() => {
        index += 1;
        const next = currentItem();
        phase = next ? (next.start_state || (mode === 'fix' ? 'coach' : 'question')) : 'done';
        if (phase === 'teach') phase='coach';
        anchorMissed=false; retryMissed=false; itemStartedAt=Date.now(); saveLocal(); render();
      }, 170);
    } else if (phase === 'retry') {
      retryMissed=true; itemStartedAt=Date.now(); saveLocal(); updateDigitDisplay();
      const msg=document.getElementById('retry-feedback');
      if (msg) { msg.classList.remove('show'); void msg.offsetWidth; msg.classList.add('show'); }
    } else {
      phase='coach'; anchorMissed=false; retryMissed=false; itemStartedAt=Date.now(); saveLocal(); render();
    }
  }

  function submitSession() {
    if (submitted) return;
    submitted=true; saveLocal();
    const nonce=`${sessionKey}:${Date.now()}:${events.length}`;
    setValue({submitted:true, mode, session_key:sessionKey, nonce, events});
  }

  function initialize(newArgs) {
    args=newArgs || {};
    mode=args.mode === 'fix' ? 'fix' : (args.mode === 'practice' ? 'practice' : 'focus');
    sessionKey=String(args.session_key || 'session');
    items=Array.isArray(args.items) ? args.items : [];
    if (!loadLocal()) {
      index=0;
      phase=items[0] ? (items[0].start_state || (mode === 'fix' ? 'coach' : 'question')) : 'done';
      if (phase === 'teach') phase='coach';
      digits=''; events=[]; itemStartedAt=Date.now(); submitted=false; anchorMissed=false; retryMissed=false; saveLocal();
    }
    initialized=true; render();
    if (submitted && events.length) setTimeout(() => setValue({submitted:true, mode, session_key:sessionKey, nonce:`${sessionKey}:replay:${Date.now()}`, events}), 40);
  }

  document.addEventListener('keydown', event => {
    if (!initialized || submitted) return;
    if (event.key >= '0' && event.key <= '9') { event.preventDefault(); addDigit(event.key); }
    else if (event.key === 'Backspace' || event.key === 'Delete') { event.preventDefault(); erase(); }
    else if (event.key === 'Enter') { event.preventDefault(); submitAnswer(); }
  });

  window.addEventListener('message', event => {
    if (!event.data || event.data.type !== 'streamlit:render') return;
    const newArgs=event.data.args || {};
    const newKey=String(newArgs.session_key || 'session');
    if (!initialized || newKey !== sessionKey) initialize(newArgs);
    else { args=newArgs; setHeight(); }
  });
  if (window.ResizeObserver) new ResizeObserver(setHeight).observe(document.documentElement);
  ready();
})();
</script>
</body>
</html>
