<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}*{box-sizing:border-box}body{margin:0;padding:4px 2px 8px;background:transparent}.wrap{max-width:720px;margin:0 auto}.card{border:1px solid #fde68a;background:linear-gradient(180deg,#fffbeb 0%,#fff 100%);border-radius:22px;padding:16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.qnum{font-weight:850;font-size:14px;color:#374151}.domain{display:inline-flex;align-items:center;border:1px solid #fde68a;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;color:#92400e;background:#fff}.progress{display:flex;gap:5px;margin:8px 0 14px}.seg{height:8px;flex:1;border-radius:999px;background:#e5e7eb}.seg.done{background:#f59e0b}.seg.current{background:#fcd34d}.prompt{font-size:clamp(40px,10vw,64px);line-height:1.08;text-align:center;color:#92400e;font-weight:950;letter-spacing:-.035em;margin:16px 0}.original{text-align:center;color:#6b7280;font-size:14px;margin:-4px 0 12px}.entry{max-width:430px;margin:0 auto 9px;height:56px;display:flex;align-items:center;justify-content:center;border:2px solid #fcd34d;border-radius:16px;background:#fff;font-size:30px;font-weight:900}.entry.empty{color:#9ca3af;font-size:17px;font-weight:750}.pad{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{min-height:54px;border:1px solid #d1d5db;border-radius:15px;background:#fff;color:#111827;font-size:23px;font-weight:900;cursor:pointer;touch-action:manipulation}.pad .utility{color:#4b5563;background:#f9fafb}.pad .submit{background:#b45309;color:#fff;border-color:#b45309;font-size:18px}.message{text-align:center;font-size:14px;font-weight:800;min-height:21px;margin-top:7px}.message.error{color:#b91c1c}.message.good{color:#166534}.help{color:#6b7280;text-align:center;font-size:12px;margin-top:7px}@media(max-width:480px){.card{padding:13px 11px}.pad button{min-height:52px}}
</style></head><body><div id="root" class="wrap"></div><script>
(()=>{let args=null,digits='';let state=null;function post(type,extra={}){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),'*')}function ready(){post('streamlit:componentReady',{apiVersion:1})}function setHeight(h=620){post('streamlit:setFrameHeight',{height:h})}function setValue(v){post('streamlit:setComponentValue',{value:v,dataType:'json'})}function key(){return `tdfc_alt_fix_v1:${args.attempt_key}`}function fresh(){return{version:args.version,index:0,corrections:[],completePayload:null}}function load(){try{const raw=localStorage.getItem(key());if(!raw)return fresh();const p=JSON.parse(raw);if(p.version!==args.version||!Array.isArray(p.corrections))return fresh();return p}catch(_){return fresh()}}function save(){try{localStorage.setItem(key(),JSON.stringify(state))}catch(_){}}function progress(){let out='<div class="progress">';for(let i=0;i<args.items.length;i++){let c='seg';if(i<state.index)c+=' done';else if(i===state.index)c+=' current';out+=`<div class="${c}"></div>`}return out+'</div>'}function entry(){const el=document.getElementById('entry');if(!el)return;el.textContent=digits||'Tap your answer';el.className=digits?'entry':'entry empty'}function message(text='',kind=''){const el=document.getElementById('message');if(!el)return;el.textContent=text;el.className=`message ${kind}`.trim()}function addDigit(d){const neg=digits.startsWith('-'),body=neg?digits.slice(1):digits;if(body.length>=3)return;digits=(neg?'-':'')+(body+d).replace(/^0+(?=\d)/,'');entry();message()}function toggleMinus(){digits=digits.startsWith('-')?digits.slice(1):('-'+digits);entry();message()}function erase(){digits=digits.slice(0,-1);entry();message()}function finish(){const payload={status:'complete',corrections:state.corrections};state.completePayload=payload;save();setValue(payload);document.getElementById('root').innerHTML='<div class="card"><div class="message good">✅ Fix Your Misses complete! Saving…</div></div>';setHeight(105)}function submit(){const value=Number(digits);if(!digits||digits==='-'||!Number.isInteger(value)||value<-999||value>999){message('Enter a whole-number answer.','error');return}const item=args.items[state.index];if(value!==Number(item.correct_answer)){digits='';entry();message('Not yet — try that one again.','error');return}state.corrections.push({question_number:Number(item.question_number),student_answer:value});state.index+=1;save();digits='';if(state.index>=args.items.length){finish();return}render()}function bind(){document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>addDigit(b.dataset.digit)));document.getElementById('minus').addEventListener('click',toggleMinus);document.getElementById('erase').addEventListener('click',erase);document.getElementById('submit').addEventListener('click',submit)}function render(){if(!args||!Array.isArray(args.items)||!args.items.length)return;if(!state)state=load();if(state.completePayload){setValue(state.completePayload);document.getElementById('root').innerHTML='<div class="card"><div class="message good">✅ Fix Your Misses complete! Saving…</div></div>';setHeight(105);return}if(state.index>=args.items.length){finish();return}const item=args.items[state.index];document.getElementById('root').innerHTML=`<div class="card"><div class="topline"><div class="qnum">Fix ${state.index+1} of ${args.items.length}</div><div class="domain">${item.domain}</div></div>${progress()}<div class="prompt">${item.prompt}</div><div class="original">Your Daily answer was <strong>${item.original_answer}</strong>. Try it again.</div><div id="entry" class="entry empty">Tap your answer</div><div class="pad"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button id="minus" class="utility">−</button><button data-digit="0">0</button><button id="submit" class="submit">✓</button><button id="erase" class="utility" style="grid-column:1/4">⌫ Delete</button></div><div id="message" class="message"></div><div class="help">Get each missed question correct before moving on.</div></div>`;bind();setHeight(window.innerWidth<480?650:625)}document.addEventListener('keydown',e=>{if(!args)return;if(e.key>='0'&&e.key<='9'){e.preventDefault();addDigit(e.key)}else if(e.key==='-'){e.preventDefault();toggleMinus()}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();submit()}});window.addEventListener('message',e=>{if(!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};state=load();render()});ready();setHeight(625)})();
</script></body></html>
