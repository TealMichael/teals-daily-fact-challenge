<!doctype html>
<html>
<head><meta charset="utf-8"><title>Teacher remembered sign-in bridge</title></head>
<body style="margin:0;padding:0;overflow:hidden;background:transparent;">
<script>
(() => {
  // Separate from tdfc_student_login_v1: a teacher sign-out cannot erase a student's saved login.
  const STORAGE_KEY = "tdfc_teacher_login_v1";

  function post(type, extra={}) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), "*");
  }
  function ready() { post("streamlit:componentReady", {apiVersion:1}); }
  function setHeight() { post("streamlit:setFrameHeight", {height:0}); }
  function setValue(value) { post("streamlit:setComponentValue", {value, dataType:"json"}); }

  function handle(args) {
    const action = String((args && args.action) || "read");
    if (action === "store") {
      try {
        const token = String(args.token || "");
        if (!token) throw new Error("Missing teacher token");
        localStorage.setItem(STORAGE_KEY, token);
        setValue({ready:true, stored:true});
      } catch (_) {
        setValue({ready:true, stored:false});
      }
      return;
    }
    if (action === "clear") {
      try {
        localStorage.removeItem(STORAGE_KEY);
        setValue({ready:true, cleared:true});
      } catch (_) {
        setValue({ready:true, cleared:false});
      }
      return;
    }
    let token = null;
    try { token = localStorage.getItem(STORAGE_KEY); } catch (_) {}
    setValue({ready:true, token:token || null});
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    if (!event.data || event.data.type !== "streamlit:render") return;
    handle(event.data.args || {});
    setHeight();
  });
  ready();
  setHeight();
})();
</script>
</body>
</html>
