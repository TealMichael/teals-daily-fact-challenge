<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#111827; }
  * { box-sizing:border-box; }
  body { margin:0; padding:2px 2px 8px; background:transparent; }
  .wrap { max-width:360px; margin:0 auto; }
  .slots { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:2px 0 10px; }
  .slot {
    min-height:48px; border:1px solid #cbd5e1; border-radius:14px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:25px; font-weight:900;
  }
  .slot.filled { border-color:#5eead4; background:#f0fdfa; }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  button {
    min-height:46px; border:1px solid #d1d5db; border-radius:13px;
    background:#fff; color:#111827; font-size:21px; font-weight:900;
    cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  button:active { transform:translateY(1px); background:#f3f4f6; }
  .back { color:#4b5563; background:#f9fafb; }
  .status { background:#0f766e; color:#fff; border-color:#0f766e; cursor:default; }
  .status[disabled] { opacity:1; }
  .hint { margin-top:6px; text-align:center; color:#6b7280; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="slots" aria-label="Four digit PIN" aria-live="polite">
    <div class="slot" data-slot="0"></div>
    <div class="slot" data-slot="1"></div>
    <div class="slot" data-slot="2"></div>
    <div class="slot" data-slot="3"></div>
  </div>
  <div id="pad" class="pad" aria-label="PIN number pad">
    <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
    <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
    <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
    <button type="button" data-action="back" class="back" aria-label="Delete last PIN digit">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="status" class="status" disabled aria-label="PIN status">••••</button>
  </div>
  <div class="hint">Tap your 4-digit classroom PIN. Nothing is saved on this screen.</div>
</div>
<script>
(() => {
  let digits = '';
  let lastSent = null;
  let lastHeight = 0;

  const slots = Array.from(document.querySelectorAll('[data-slot]'));
  const pad = document.getElementById('pad');
  const status = document.getElementById('status');

  function post(type, extra={}) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), '*');
  }
  function ready() { post('streamlit:componentReady', {apiVersion:1}); }
  function setValue(value) { post('streamlit:setComponentValue', {value, dataType:'json'}); }
  function resize() {
    requestAnimationFrame(() => {
      const height = Math.ceil(document.documentElement.scrollHeight + 4);
      if (height !== lastHeight) {
        lastHeight = height;
        post('streamlit:setFrameHeight', {height});
      }
    });
  }

  function paint() {
    slots.forEach((slot, index) => {
      const filled = index < digits.length;
      slot.textContent = filled ? '●' : '';
      slot.classList.toggle('filled', filled);
    });
    status.textContent = digits.length === 4 ? '✓' : '••••';
    status.setAttribute('aria-label', digits.length === 4 ? 'PIN ready' : `${digits.length} of 4 PIN digits entered`);
    resize();
  }

  function sendIfComplete() {
    if (digits.length !== 4 || digits === lastSent) return;
    lastSent = digits;
    setValue(digits);
  }

  function addDigit(digit) {
    if (!/^\d$/.test(digit) || digits.length >= 4) return;
    digits += digit;
    paint();
    sendIfComplete();
  }

  function erase() {
    if (!digits.length) return;
    const wasComplete = digits.length === 4;
    digits = digits.slice(0, -1);
    if (wasComplete) {
      lastSent = null;
      setValue('');
    }
    paint();
  }

  // One permanent delegated click handler. The keypad DOM is never rebuilt
  // while a student is entering a PIN, which makes touch behavior reliable
  // across Safari/iPadOS, ChromeOS, and desktop browsers.
  pad.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || !pad.contains(button)) return;
    const digit = button.getAttribute('data-digit');
    if (digit !== null) addDigit(digit);
    else if (button.getAttribute('data-action') === 'back') erase();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key >= '0' && event.key <= '9') {
      event.preventDefault();
      addDigit(event.key);
    } else if (event.key === 'Backspace' || event.key === 'Delete') {
      event.preventDefault();
      erase();
    }
  });

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'streamlit:render') return;
    const args = event.data.args || {};
    const incoming = String(args.value || '').replace(/\D/g, '').slice(0, 4);
    if (incoming !== digits) {
      digits = incoming;
      lastSent = incoming.length === 4 ? incoming : null;
      paint();
    } else {
      resize();
    }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(resize).observe(document.documentElement);
  }

  ready();
  paint();
})();
</script>
</body>
</html>
