<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}*{box-sizing:border-box}body{margin:0;padding:4px 2px 8px;background:transparent}.wrap{max-width:720px;margin:0 auto}.card{border:1px solid #ccfbf1;background:linear-gradient(180deg,#f0fdfa 0%,#fff 100%);border-radius:22px;padding:16px}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.qnum{font-weight:850;font-size:14px;color:#374151}.timer{display:inline-flex;align-items:center;border:1px solid #99f6e4;border-radius:999px;padding:5px 10px;font-weight:850;font-size:13px;color:#115e59;background:#fff}.progress{display:flex;gap:4px;margin:8px 0 14px}.seg{height:8px;flex:1;border-radius:999px;background:#e5e7eb}.seg.done{background:#14b8a6}.seg.current{background:#99f6e4}.fact{font-size:clamp(42px,11vw,68px);line-height:1.08;text-align:center;color:#0f766e;font-weight:950;letter-spacing:-.035em;margin:16px 0}.entry{max-width:430px;margin:0 auto 9px;height:56px;display:flex;align-items:center;justify-content:center;border:2px solid #99f6e4;border-radius:16px;background:#fff;font-size:30px;font-weight:900}.entry.empty{color:#9ca3af;font-size:17px;font-weight:750}.pad{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{min-height:54px;border:1px solid #d1d5db;border-radius:15px;background:#fff;color:#111827;font-size:23px;font-weight:900;cursor:pointer;touch-action:manipulation}.pad .utility{color:#4b5563;background:#f9fafb}.pad .submit{background:#0f766e;color:#fff;border-color:#0f766e;font-size:18px}.nav-row{display:flex;gap:10px;max-width:430px;margin:9px auto 0}.nav-row button{min-height:40px;border:1px solid #d1d5db;border-radius:13px;background:#f9fafb;color:#374151;font-size:14px;font-weight:850;cursor:pointer;flex:1}.help{color:#6b7280;text-align:center;font-size:12px;margin-top:9px}.error{color:#b91c1c;text-align:center;font-size:13px;font-weight:750;min-height:18px;margin-top:5px}@media(max-width:480px){.card{padding:13px 11px}.pad button{min-height:52px}}
</style></head><body><div id="root" class="wrap"></div><script>
(()=>{let args=null,digits='';function post(type,extra={}){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),'*')}function ready(){post('streamlit:componentReady',{apiVersion:1})}function setHeight(h=610){post('streamlit:setFrameHeight',{height:h})}function setValue(v){post('streamlit:setComponentValue',{value:v,dataType:'json'})}function storageKey(){return `tdfc_alt_daily_v1:${args.attempt_key}`}function freshState(){return{version:args.daily_version,index:0,answers:Array(10).fill(null),startedMs:null,shownMs:Date.now(),completePayload:null}}function loadState(){try{const raw=localStorage.getItem(storageKey());if(!raw)return freshState();const p=JSON.parse(raw);if(p.version!==args.daily_version||!Array.isArray(p.answers)||p.answers.length!==10)return freshState();if(!p.shownMs)p.shownMs=Date.now();return p}catch(_){return freshState()}}function saveState(s){try{localStorage.setItem(storageKey(),JSON.stringify(s))}catch(_){}}function elapsed(s){return s.startedMs?Math.max(0,(Date.now()-s.startedMs)/1000):0}function progress(s){let out='<div class="progress">';for(let i=0;i<10;i++){let c='seg';if(i===s.index)c+=' current';else if(s.answers[i]!==null)c+=' done';out+=`<div class="${c}"></div>`}return out+'</div>'}function updateEntry(){const entry=document.getElementById('entry');if(entry){entry.textContent=digits||'Tap your answer';entry.className=digits?'entry':'entry empty'}const err=document.getElementById('error');if(err)err.textContent=''}function addDigit(d){const negative=digits.startsWith('-');const body=negative?digits.slice(1):digits;if(body.length>=3)return;digits=(negative?'-':'')+(body+d).replace(/^0+(?=\d)/,'');updateEntry()}function toggleMinus(){digits=digits.startsWith('-')?digits.slice(1):('-'+digits);updateEntry()}function erase(){digits=digits.slice(0,-1);updateEntry()}function submit(){const value=Number(digits),err=document.getElementById('error');if(!digits||digits==='-'||!Number.isInteger(value)||value<-999||value>999){if(err)err.textContent='Enter a whole-number answer.';return}const s=loadState();s.answers[s.index]=value;if(s.index===0&&!s.startedMs)s.startedMs=Date.now();if(s.index===9){const payload={status:'complete',answers:s.answers,timed_seconds:Number(elapsed(s).toFixed(3))};s.completePayload=payload;saveState(s);setValue(payload);document.getElementById('root').innerHTML='<div class="card"><div class="help">Saving your Daily result…</div></div>';setHeight(110);return}s.index+=1;s.shownMs=Date.now();saveState(s);digits='';render()}function render(){if(!args||!Array.isArray(args.questions)||args.questions.length!==10)return;const s=loadState();if(s.completePayload){setValue(s.completePayload);document.getElementById('root').innerHTML='<div class="card"><div class="help">Saving your Daily result…</div></div>';setHeight(110);return}const q=args.questions[s.index];if(digits===''&&s.answers[s.index]!==null)digits=String(s.answers[s.index]);const display=digits||'Tap your answer';document.getElementById('root').innerHTML=`<div class="card"><div class="topline"><div class="qnum">Question ${s.index+1} of 10</div><div class="timer">${!s.startedMs?'Question 1 starts the timer':'Timer running quietly'}</div></div>${progress(s)}<div class="fact">${q.prompt}</div><div class="${digits?'entry':'entry empty'}">${display}</div><div class="pad"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button id="minus" class="utility">−</button><button data-digit="0">0</button><button id="submit" class="submit">✓</button><button id="erase" class="utility" style="grid-column:1/4">⌫ Delete</button></div><div id="error" class="error"></div>${s.index>0?'<div class="nav-row"><button id="backButton">← Back to previous question</button></div>':''}<div class="help">${s.index===0&&!s.startedMs?'Question 1 counts toward accuracy. The quiet timer begins when you press ✓.':'No right/wrong feedback until all 10 are finished.'}</div></div>`;setHeight(window.innerWidth<480?650:630);document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>addDigit(b.dataset.digit)));document.getElementById('minus').addEventListener('click',toggleMinus);document.getElementById('erase').addEventListener('click',erase);document.getElementById('submit').addEventListener('click',submit);const back=document.getElementById('backButton');if(back)back.addEventListener('click',()=>{const c=loadState();if(c.index>0){c.index-=1;c.shownMs=Date.now();saveState(c);digits=c.answers[c.index]===null?'':String(c.answers[c.index]);render()}})}document.addEventListener('keydown',e=>{if(e.key>='0'&&e.key<='9'){e.preventDefault();addDigit(e.key)}else if(e.key==='-' ){e.preventDefault();toggleMinus()}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();submit()}});window.addEventListener('message',e=>{if(!e.data||e.data.type!=='streamlit:render')return;args=e.data.args||{};render()});ready();setHeight(630)})();
</script></body></html>
