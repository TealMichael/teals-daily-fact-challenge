<section id="igniter-stage" aria-label="Math Igniter presentation">
  <header class="slide-header">
    <h1>Math Igniter — <span id="lesson-date"></span></h1>
    <strong id="class-name"></strong>
  </header>
  <div class="slide-layout">
    <aside class="routine" aria-label="When you enter routine">
      <h2>WHEN YOU ENTER <small>Follow these steps in order.</small></h2>
      <ol>
        <li><span class="checkbox" aria-hidden="true"></span><span class="step-number">1</span><span>Get your Igniter sheet and pencil ready.</span></li>
        <li class="active"><span class="checkbox" aria-hidden="true"></span><span class="step-number">2</span><strong>Solve BOTH Igniter problems ON PAPER.</strong></li>
        <li><span class="checkbox" aria-hidden="true"></span><span class="step-number">3</span><span>Check Igniter answers in Teal's Daily Challenge.</span></li>
        <li><span class="checkbox" aria-hidden="true"></span><span class="step-number">4</span><span>Complete your Daily Fact Challenge.</span></li>
      </ol>
    </aside>
    <div class="question-grid">
      <article class="question-card question-one"><div class="question-label"><strong>1. Review Standard</strong></div><div id="question-one" class="question-body"></div><div id="answer-one" class="answer" hidden aria-live="polite"></div></article>
      <article class="question-card question-two"><div class="question-label"><strong>2. Daily Refresher</strong></div><div id="question-two" class="question-body"></div><div id="answer-two" class="answer" hidden aria-live="polite"></div></article>
    </div>
  </div>
  <nav class="presentation-controls" aria-label="Teacher presentation controls">
    <button id="reveal-one" aria-controls="answer-one" aria-expanded="false">Show Answer 1</button>
    <button id="reveal-two" aria-controls="answer-two" aria-expanded="false">Show Answer 2</button>
    <span class="control-divider"></span><button id="previous" aria-label="Previous day">← Day</button><button id="today">Today</button><button id="next" aria-label="Next day">Day →</button>
    <button id="fullscreen">Full screen</button><button id="exit">Dashboard</button>
  </nav><div id="screen-status" role="status"></div>
</section>
