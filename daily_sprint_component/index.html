<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<style>
  :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#111827; }
  * { box-sizing:border-box; }
  body { margin:0; padding:4px 2px 8px; background:transparent; }
  .wrap { max-width:720px; margin:0 auto; }
  .card { border:1px solid #ccfbf1; background:linear-gradient(180deg,#f0fdfa 0%,#ffffff 100%); border-radius:22px; padding:18px 16px; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .qnum { font-weight:850; font-size:14px; color:#374151; }
  .timer { display:inline-flex; align-items:center; border:1px solid #99f6e4; border-radius:999px; padding:5px 10px; font-weight:850; font-size:13px; color:#115e59; background:#fff; }
  .progress { display:flex; gap:4px; margin:8px 0 20px; }
  .seg { height:8px; flex:1; border-radius:999px; background:#e5e7eb; }
  .seg.done { background:#14b8a6; }
  .seg.current { background:#99f6e4; }
  .fact { font-size:clamp(52px,14vw,82px); line-height:1; text-align:center; color:#0f766e; font-weight:950; letter-spacing:-0.06em; margin:20px 0 22px; }
  .answer-row { display:flex; gap:10px; max-width:460px; margin:0 auto; }
  .nav-row { display:flex; gap:10px; max-width:460px; margin:10px auto 0; }
  input { min-width:0; flex:1; height:56px; border:2px solid #d1d5db; border-radius:15px; font-size:28px; font-weight:850; text-align:center; outline:none; background:white; color:#111827; }
  input:focus { border-color:#14b8a6; box-shadow:0 0 0 3px rgba(20,184,166,.14); }
  button { height:56px; border:0; border-radius:15px; padding:0 18px; background:#0f766e; color:#fff; font-size:17px; font-weight:900; cursor:pointer; white-space:nowrap; }
  button.secondary { height:44px; background:#eef2f1; color:#374151; border:1px solid #d1d5db; flex:1; }
  button:active { transform:translateY(1px); }
  .help { color:#6b7280; text-align:center; font-size:13px; margin-top:12px; }
  .error { color:#b91c1c; text-align:center; font-size:13px; font-weight:750; min-height:20px; margin-top:6px; }
  @media (max-width:480px) {
    .card { padding:16px 12px; }
    .answer-row { flex-direction:column; }
    .nav-row { width:100%; }
    button { width:100%; }
    input { width:100%; }
    .topline { align-items:flex-start; }
  }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
(() => {
  let args = null;

  function post(type, extra={}) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true, type}, extra), "*");
  }
  function ready() { post("streamlit:componentReady", {apiVersion:1}); }
  function setHeight(height=430) { post("streamlit:setFrameHeight", {height}); }
  function setValue(value) { post("streamlit:setComponentValue", {value, dataType:"json"}); }

  function storageKey() {
    return `tdfc_daily_v1:${args.attempt_key}`;
  }
  function freshState() {
    return {
      version:args.challenge_version,
      index:0,
      answers:Array(10).fill(null),
      responseSeconds:Array(10).fill(null),
      startedMs:null,
      shownMs:Date.now(),
      completePayload:null
    };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(storageKey());
      if (!raw) return freshState();
      const parsed = JSON.parse(raw);
      if (parsed.version !== args.challenge_version || !Array.isArray(parsed.answers) || parsed.answers.length !== 10) return freshState();
      if (!Array.isArray(parsed.responseSeconds) || parsed.responseSeconds.length !== 10) parsed.responseSeconds = Array(10).fill(null);
      if (!parsed.shownMs) parsed.shownMs = Date.now();
      return parsed;
    } catch (_) { return freshState(); }
  }
  function saveState(state) {
    try { localStorage.setItem(storageKey(), JSON.stringify(state)); } catch (_) {}
  }
  function elapsedSeconds(state) {
    if (!state.startedMs) return 0;
    return Math.max(0, (Date.now() - state.startedMs) / 1000);
  }
  function fmtSeconds(seconds) {
    if (seconds < 60) return `${seconds.toFixed(1)}s`;
    const m = Math.floor(seconds / 60);
    const r = seconds - m*60;
    return `${m}:${r.toFixed(1).padStart(4,"0")}`;
  }
  function timerText(state) {
    return !state.startedMs ? "Fact 1 starts the timer" : "Timer running quietly";
  }
  function progressHtml(state) {
    let html = '<div class="progress">';
    for (let i=0;i<10;i++) {
      let cls='seg';
      if (i === state.index) cls += ' current';
      else if (state.answers[i] !== null) cls += ' done';
      html += `<div class="${cls}"></div>`;
    }
    return html + '</div>';
  }
  function render() {
    if (!args || !Array.isArray(args.facts) || args.facts.length !== 10) return;
    const state = loadState();
    if (state.completePayload) {
      setValue(state.completePayload);
      document.getElementById('root').innerHTML = '<div class="card"><div class="help">Saving your Daily result…</div></div>';
      setHeight(110);
      return;
    }
    const fact = args.facts[state.index];
    const isFirst = state.index === 0;
    const buttonText = state.index === 9 ? 'Finish' : (isFirst && !state.startedMs ? 'Submit & start timer' : 'Save & next');
    const priorValue = state.answers[state.index] === null ? '' : String(state.answers[state.index]);
    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="topline"><div class="qnum">Fact ${state.index + 1} of 10</div><div id="timer" class="timer">${timerText(state)}</div></div>
        ${progressHtml(state)}
        <div class="fact">${fact.a} × ${fact.b}</div>
        <form id="answerForm" autocomplete="off">
          <div class="answer-row">
            <input id="answer" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="200" aria-label="Answer" value="${priorValue}" />
            <button type="submit">${buttonText}</button>
          </div>
          <div id="error" class="error"></div>
        </form>
        ${state.index > 0 ? '<div class="nav-row"><button id="backButton" class="secondary" type="button">← Back</button></div>' : ''}
        <div class="help">${isFirst && !state.startedMs ? 'Fact 1 counts toward accuracy. Your timed sprint begins when you submit it.' : (isFirst ? 'Your timer is still running while you revise Fact 1.' : 'No right/wrong feedback until all 10 are finished. Accuracy ranks before speed.')}</div>
      </div>`;
    setHeight(window.innerWidth < 480 ? 455 : 385);

    const input = document.getElementById('answer');
    setTimeout(() => input && input.focus(), 40);
    const back = document.getElementById('backButton');
    if (back) back.addEventListener('click', () => {
      const current = loadState();
      if (current.index > 0) {
        current.index -= 1;
        current.shownMs = Date.now();
        saveState(current);
        render();
      }
    });
    document.getElementById('answerForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const raw = input.value.trim();
      const value = Number(raw);
      if (!raw || !Number.isInteger(value) || value < 0 || value > 200) {
        document.getElementById('error').textContent = 'Enter a whole-number answer.';
        input.focus();
        return;
      }
      const current = loadState();
      const firstSubmissionForFact = current.answers[current.index] === null;
      current.answers[current.index] = value;
      if (firstSubmissionForFact && current.index > 0 && current.responseSeconds[current.index] === null) {
        current.responseSeconds[current.index] = Number(Math.max(0, (Date.now() - (current.shownMs || Date.now())) / 1000).toFixed(3));
      }
      // Fact 1 counts for accuracy but intentionally contributes no speed evidence.
      current.responseSeconds[0] = null;
      if (current.index === 0 && !current.startedMs) current.startedMs = Date.now();
      if (current.index === 9) {
        const payload = {
          status:'complete',
          answers:current.answers,
          response_seconds:current.responseSeconds,
          timed_seconds:Number(elapsedSeconds(current).toFixed(3))
        };
        current.completePayload = payload;
        saveState(current);
        setValue(payload);
        document.getElementById('root').innerHTML = '<div class="card"><div class="help">Saving your Daily result…</div></div>';
        setHeight(110);
        return;
      }
      current.index += 1;
      current.shownMs = Date.now();
      saveState(current);
      render();
    });
  }

  window.addEventListener('message', (event) => {
    if (!event.data || event.data.type !== 'streamlit:render') return;
    args = event.data.args || {};
    render();
  });
  ready();
  setHeight(385);
})();
</script>
</body>
</html>
