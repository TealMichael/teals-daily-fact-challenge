<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  :root { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#111827; }
  * { box-sizing:border-box; }
  body { margin:0; padding:4px 2px 8px; background:transparent; }
  .wrap { max-width:720px; margin:0 auto; }
  .card { border:1px solid #ccfbf1; background:linear-gradient(180deg,#f0fdfa 0%,#ffffff 100%); border-radius:22px; padding:16px; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .qnum { font-weight:850; font-size:14px; color:#374151; }
  .timer { display:inline-flex; align-items:center; border:1px solid #99f6e4; border-radius:999px; padding:5px 10px; font-weight:850; font-size:13px; color:#115e59; background:#fff; }
  .progress { display:flex; gap:4px; margin:8px 0 14px; }
  .seg { height:8px; flex:1; border-radius:999px; background:#e5e7eb; }
  .seg.done { background:#14b8a6; }
  .seg.current { background:#99f6e4; }
  .fact { font-size:clamp(48px,13vw,76px); line-height:1; text-align:center; color:#0f766e; font-weight:950; letter-spacing:-0.06em; margin:14px 0 14px; }
  .entry { max-width:430px; margin:0 auto 9px; height:56px; display:flex; align-items:center; justify-content:center; border:2px solid #99f6e4; border-radius:16px; background:#fff; font-size:30px; font-weight:900; }
  .entry.empty { color:#9ca3af; font-size:17px; font-weight:750; }
  .pad { max-width:430px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .pad button { min-height:54px; border:1px solid #d1d5db; border-radius:15px; background:#fff; color:#111827; font-size:23px; font-weight:900; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .pad button:active { transform:translateY(1px); background:#f3f4f6; }
  .pad .backspace { color:#4b5563; background:#f9fafb; }
  .pad .submit { background:#0f766e; color:#fff; border-color:#0f766e; font-size:18px; }
  .nav-row { display:flex; gap:10px; max-width:430px; margin:9px auto 0; }
  .nav-row button { min-height:40px; border:1px solid #d1d5db; border-radius:13px; background:#f9fafb; color:#374151; font-size:14px; font-weight:850; cursor:pointer; flex:1; }
  .help { color:#6b7280; text-align:center; font-size:12px; margin-top:9px; }
  .error { color:#b91c1c; text-align:center; font-size:13px; font-weight:750; min-height:18px; margin-top:5px; }
  @media (max-width:480px) { .card{padding:13px 11px}.topline{align-items:flex-start}.pad button{min-height:52px} }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script>
(() => {
  let args = null;
  let digits = '';

  function post(type, extra={}) { window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),'*'); }
  function ready(){ post('streamlit:componentReady',{apiVersion:1}); }
  function setHeight(height=590){ post('streamlit:setFrameHeight',{height}); }
  function setValue(value){ post('streamlit:setComponentValue',{value,dataType:'json'}); }
  function storageKey(){ return `tdfc_daily_v1:${args.attempt_key}`; }
  function freshState(){ return {version:args.challenge_version,index:0,answers:Array(10).fill(null),firstAnswers:Array(10).fill(null),responseSeconds:Array(10).fill(null),startedMs:null,shownMs:Date.now(),completePayload:null}; }
  function loadState(){
    try {
      const raw=localStorage.getItem(storageKey()); if(!raw) return freshState();
      const parsed=JSON.parse(raw);
      if(parsed.version!==args.challenge_version || !Array.isArray(parsed.answers) || parsed.answers.length!==10) return freshState();
      if(!Array.isArray(parsed.firstAnswers)||parsed.firstAnswers.length!==10) parsed.firstAnswers=parsed.answers.slice();
      if(!Array.isArray(parsed.responseSeconds)||parsed.responseSeconds.length!==10) parsed.responseSeconds=Array(10).fill(null);
      if(!parsed.shownMs) parsed.shownMs=Date.now(); return parsed;
    } catch(_){ return freshState(); }
  }
  function saveState(state){ try{localStorage.setItem(storageKey(),JSON.stringify(state));}catch(_){} }
  function elapsedSeconds(state){ return state.startedMs ? Math.max(0,(Date.now()-state.startedMs)/1000) : 0; }
  function timerText(state){ return !state.startedMs ? 'Fact 1 starts the timer' : 'Timer running quietly'; }
  function progressHtml(state){ let out='<div class="progress">'; for(let i=0;i<10;i++){let cls='seg'; if(i===state.index)cls+=' current'; else if(state.answers[i]!==null)cls+=' done'; out+=`<div class="${cls}"></div>`;} return out+'</div>'; }

  function updateDigitDisplay(){
    const entry=document.querySelector('.entry');
    if(!entry)return;
    entry.textContent=digits||'Tap your answer';
    entry.className=digits?'entry':'entry empty';
    const error=document.getElementById('error');
    if(error)error.textContent='';
  }
  function addDigit(d){ if(digits.length>=3)return; digits+=d; if(digits.length>1)digits=digits.replace(/^0+/,'')||'0'; updateDigitDisplay(); }
  function erase(){ digits=digits.slice(0,-1); updateDigitDisplay(); }
  function submitAnswer(){
    const value=Number(digits); const error=document.getElementById('error');
    if(!digits || !Number.isInteger(value) || value<0 || value>200){ if(error)error.textContent='Enter a whole-number answer.'; return; }
    const current=loadState(); const firstSubmission=current.firstAnswers[current.index]===null;
    current.answers[current.index]=value;
    if(firstSubmission){ current.firstAnswers[current.index]=value; }
    if(firstSubmission && current.index>0 && current.responseSeconds[current.index]===null){ current.responseSeconds[current.index]=Number(Math.max(0,(Date.now()-(current.shownMs||Date.now()))/1000).toFixed(3)); }
    current.responseSeconds[0]=null;
    if(current.index===0 && !current.startedMs) current.startedMs=Date.now();
    if(current.index===9){
      const payload={status:'complete',answers:current.answers,first_answers:current.firstAnswers,response_seconds:current.responseSeconds,timed_seconds:Number(elapsedSeconds(current).toFixed(3))};
      current.completePayload=payload; saveState(current); setValue(payload);
      document.getElementById('root').innerHTML='<div class="card"><div class="help">Saving your Daily result…</div></div>'; setHeight(110); return;
    }
    current.index+=1; current.shownMs=Date.now(); saveState(current); digits=''; render();
  }

  function render(){
    if(!args || !Array.isArray(args.facts) || args.facts.length!==10)return;
    const state=loadState();
    if(state.completePayload){ setValue(state.completePayload); document.getElementById('root').innerHTML='<div class="card"><div class="help">Saving your Daily result…</div></div>'; setHeight(110); return; }
    const fact=args.facts[state.index]; const isFirst=state.index===0;
    if(digits==='' && state.answers[state.index]!==null) digits=String(state.answers[state.index]);
    const display=digits||'Tap your answer'; const displayClass=digits?'entry':'entry empty';
    document.getElementById('root').innerHTML=`
      <div class="card">
        <div class="topline"><div class="qnum">Fact ${state.index+1} of 10</div><div class="timer">${timerText(state)}</div></div>
        ${progressHtml(state)}
        <div class="fact">${fact.a} × ${fact.b}</div>
        <div class="${displayClass}" aria-live="polite">${display}</div>
        <div class="pad" aria-label="Number pad">
          <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
          <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
          <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
          <button type="button" id="erase" class="backspace" aria-label="Delete last digit">⌫</button><button type="button" data-digit="0">0</button><button type="button" id="submit" class="submit">✓</button>
        </div>
        <div id="error" class="error"></div>
        ${state.index>0?'<div class="nav-row"><button id="backButton" type="button">← Back to previous fact</button></div>':''}
        <div class="help">${isFirst&&!state.startedMs?'Fact 1 counts toward accuracy. The quiet timer begins when you press ✓.':'No right/wrong feedback until all 10 are finished. Physical keyboard input still works too.'}</div>
      </div>`;
    setHeight(window.innerWidth<480?610:590);
    document.querySelectorAll('[data-digit]').forEach(btn=>btn.addEventListener('click',()=>addDigit(btn.dataset.digit)));
    document.getElementById('erase').addEventListener('click',erase);
    document.getElementById('submit').addEventListener('click',submitAnswer);
    const back=document.getElementById('backButton');
    if(back)back.addEventListener('click',()=>{const current=loadState();if(current.index>0){current.index-=1;current.shownMs=Date.now();saveState(current);digits=current.answers[current.index]===null?'':String(current.answers[current.index]);render();}});
  }

  document.addEventListener('keydown',(event)=>{
    if(event.key>='0'&&event.key<='9'){event.preventDefault();addDigit(event.key);}
    else if(event.key==='Backspace'||event.key==='Delete'){event.preventDefault();erase();}
    else if(event.key==='Enter'){event.preventDefault();submitAnswer();}
  });
  window.addEventListener('message',(event)=>{if(!event.data||event.data.type!=='streamlit:render')return; args=event.data.args||{}; render();});
  ready(); setHeight(590);
})();
</script>
</body>
</html>
