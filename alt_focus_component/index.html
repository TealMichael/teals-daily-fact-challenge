<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;--teal:#0f766e;--teal2:#14b8a6;--teal-bg:#f0fdfa;--orange:#f97316;--orange-bg:#fff7ed;--purple:#7c3aed;--purple-bg:#f5f3ff;--red:#b91c1c;--red-bg:#fef2f2;--muted:#6b7280}*{box-sizing:border-box}body{margin:0;padding:3px 2px 12px;background:transparent}.wrap{max-width:620px;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 3px 7px;color:#4b5563;font-size:13px;font-weight:850}.domain{display:inline-flex;align-items:center;border:1px solid #99f6e4;border-radius:999px;padding:4px 9px;font-weight:850;font-size:11px;color:#115e59;background:#f0fdfa}.track{height:8px;border-radius:999px;overflow:hidden;background:#e5e7eb;margin:0 2px 11px}.fill{height:100%;background:var(--teal);transition:width .2s ease}.context{border:1px solid #d1fae5;background:var(--teal-bg);border-radius:14px;padding:9px 12px;margin:5px 0 9px;text-align:center}.context .missed{font-size:18px;font-weight:950}.context .said{margin-top:2px;color:#4b5563;font-size:13px;font-weight:750}.coach-card{border:1px solid #99f6e4;background:#f8fffe;border-radius:20px;padding:13px 12px 14px;margin:8px 0 12px;overflow:hidden;text-align:center}.stage-row{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:7px}.stage-chip{border-radius:999px;padding:4px 9px;font-size:11px;font-weight:950;letter-spacing:.04em;background:#e5e7eb;color:#6b7280;opacity:.38;transform:scale(.94);transition:opacity .24s ease,transform .24s ease,background .24s ease,color .24s ease}.coach-card.seq-see .stage-chip.see,.coach-card.seq-connect .stage-chip.see,.coach-card.seq-turn .stage-chip.see,.coach-card.seq-connect .stage-chip.connect,.coach-card.seq-turn .stage-chip.connect,.coach-card.seq-turn .stage-chip.turn{opacity:1;transform:scale(1);background:#ccfbf1;color:#115e59}.coach-title{font-size:27px;font-weight:950;letter-spacing:-.02em;margin:1px 0 2px}.coach-sub{color:#4b5563;font-size:14px;font-weight:800;min-height:20px;margin-bottom:4px}.watch-controls{display:flex;justify-content:center;align-items:center;gap:8px;min-height:48px;margin:7px 0 5px}.watch-btn{min-height:44px;padding:0 24px;border-radius:999px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-size:16px;font-weight:950;cursor:pointer;touch-action:manipulation}.watch-btn.secondary{display:none;background:#fff;color:var(--teal)}.coach-card.sequence-complete .watch-btn.primary{display:none}.coach-card.sequence-complete .watch-btn.secondary{display:inline-block}.coach-card.sequence-playing .watch-btn.primary{opacity:.6;pointer-events:none}.visual{min-height:120px;margin:6px auto 3px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.relationship{max-width:470px;margin:6px auto 2px;padding:8px 10px;border-radius:12px;background:#f8fafc;color:#374151;font-size:14px;font-weight:850;opacity:0;transform:translateY(5px);transition:.3s}.coach-card.seq-connect .relationship,.coach-card.seq-turn .relationship{opacity:1;transform:none}.steps{display:grid;gap:5px;max-width:470px;margin:7px auto 2px;text-align:left}.step{border-radius:10px;padding:7px 9px;background:#fff;border:1px solid #d1fae5;color:#374151;font-size:13px;font-weight:800;opacity:0;transform:translateY(5px);transition:.3s}.coach-card.seq-connect .step{opacity:1;transform:none}.step:nth-child(2){transition-delay:.12s}.step:nth-child(3){transition-delay:.24s}.step:nth-child(4){transition-delay:.36s}.final-eq{max-width:430px;margin:9px auto 2px;border:2px solid #99f6e4;background:#ecfdf5;color:#065f46;border-radius:14px;padding:9px 11px;font-size:22px;font-weight:950;opacity:0;transform:translateY(7px) scale(.98);transition:.3s}.coach-card.seq-turn .final-eq{opacity:1;transform:none}.continue-wrap{margin-top:10px;opacity:0;pointer-events:none;transform:translateY(5px);transition:.3s}.coach-card.seq-turn .continue-wrap{opacity:1;pointer-events:auto;transform:none}.continue{min-height:46px;border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:14px;padding:0 22px;font-size:16px;font-weight:950;cursor:pointer;touch-action:manipulation}
/* Ten frames */.ten-pair{display:flex;align-items:flex-start;justify-content:center;gap:12px;flex-wrap:wrap}.ten-block{display:grid;grid-template-columns:repeat(5,20px);grid-template-rows:repeat(2,20px);gap:4px;border:2px solid #cbd5e1;border-radius:9px;padding:5px;background:#fff}.dot{width:20px;height:20px;border-radius:50%;background:#e5e7eb;opacity:.22;transform:scale(.7);transition:.35s}.coach-card.seq-see .dot.base,.coach-card.seq-see .dot.source-move{background:var(--teal);opacity:1;transform:scale(1)}.coach-card.seq-connect .dot.base{background:var(--teal);opacity:1;transform:scale(1)}.coach-card.seq-connect .dot.source-move{background:var(--orange);opacity:.12;transform:translateX(-10px) scale(.72)}.coach-card.seq-connect .dot.target-move{background:var(--orange);opacity:1;transform:scale(1.08)}.frame-label{font-size:12px;color:#64748b;font-weight:850;margin-top:3px}.make-ten-eq{font-size:18px;font-weight:950;color:#0f766e;opacity:0;transition:.3s}.coach-card.seq-connect .make-ten-eq{opacity:1}
/* Counter groups */.counter-groups{display:flex;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap}.counter-group{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:210px;padding:8px 10px;border-radius:14px;background:#fff;border:1px solid #d1fae5}.counter{width:18px;height:18px;border-radius:50%;background:var(--teal);opacity:0;transform:scale(.5);transition:.25s}.coach-card.seq-see .counter.first{opacity:1;transform:scale(1)}.coach-card.seq-connect .counter{opacity:1;transform:scale(1)}.counter.extra{background:var(--orange)}
/* Bar model */.bar-shell{width:min(92%,470px);margin:3px auto}.whole-label{font-size:12px;font-weight:850;color:#64748b;margin-bottom:4px}.bar{height:58px;border:2px solid #94a3b8;border-radius:14px;overflow:hidden;display:flex;background:#fff}.bar-known,.bar-unknown{height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:950;transition:.45s}.bar-known{background:#fed7aa;color:#9a3412;opacity:0}.bar-unknown{background:#ccfbf1;color:#115e59;opacity:0}.coach-card.seq-see .bar-known{opacity:1}.coach-card.seq-connect .bar-known,.coach-card.seq-connect .bar-unknown{opacity:1}.bar-unknown span{opacity:0;transition:.35s .2s}.coach-card.seq-connect .bar-unknown span{opacity:1}.missing-eq{font-size:18px;font-weight:950;margin-top:7px;color:#334155;opacity:0;transition:.3s}.coach-card.seq-connect .missing-eq{opacity:1}
/* Equal groups / multiplication arrays */.groups-grid{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;max-width:530px}.group-box{min-width:46px;min-height:46px;border:2px solid #99f6e4;border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;background:#fff;opacity:0;transform:scale(.88);transition:.3s}.coach-card.seq-see .group-box{opacity:1;transform:scale(1)}.group-dot{width:9px;height:9px;border-radius:50%;background:var(--teal);opacity:0;transform:scale(.4);transition:.28s}.coach-card.seq-connect .group-dot{opacity:1;transform:scale(1)}.mult-array{display:grid;gap:4px;justify-content:center;padding:5px}.mult-cell{width:12px;height:12px;border-radius:4px;background:var(--teal);opacity:0;transform:scale(.55);transition:.3s}.coach-card.seq-see .mult-cell{opacity:1;transform:scale(1)}.coach-card.seq-connect .mult-cell.part-a{background:var(--orange)}.coach-card.seq-connect .mult-cell.part-b{background:var(--purple)}.coach-card.seq-connect .mult-cell.removed{background:#9ca3af;opacity:.18;transform:scale(.78)}
/* Number line */.number-line{width:min(94%,500px);position:relative;height:92px;margin-top:5px}.axis{position:absolute;left:3%;right:3%;top:48px;height:4px;background:#94a3b8;border-radius:999px;opacity:0;transition:.3s}.coach-card.seq-see .axis{opacity:1}.tick{position:absolute;top:39px;width:2px;height:20px;background:#64748b;opacity:0;transition:.25s}.tick-label{position:absolute;top:61px;transform:translateX(-50%);font-size:10px;color:#64748b;font-weight:750;opacity:0;transition:.25s}.coach-card.seq-see .tick,.coach-card.seq-see .tick-label{opacity:1}.walker{position:absolute;top:24px;transform:translateX(-50%);border-radius:999px;padding:4px 8px;background:var(--orange);color:white;font-size:12px;font-weight:950;opacity:0;transition:left .9s ease,opacity .25s}.coach-card.seq-see .walker{opacity:1}.coach-card.seq-connect .walker{left:var(--end-left)!important;background:var(--teal)}.move-arrow{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#0f766e;opacity:0;transition:.3s}.coach-card.seq-connect .move-arrow{opacity:1}
/* Retry */.retry-card{border:1px solid #99f6e4;background:var(--teal-bg);border-radius:18px;padding:12px 11px;margin:7px 0}.boss-chip{display:inline-block;border-radius:999px;padding:4px 10px;background:#ccfbf1;color:#115e59;font-size:11px;font-weight:950;letter-spacing:.04em}.boss-fact{font-size:clamp(38px,9vw,58px);line-height:1.1;text-align:center;font-weight:950;letter-spacing:-.035em;margin:9px 0 5px}.boss-hint{font-size:13px;color:#475569;font-weight:850;text-align:center;margin:0 auto 9px;max-width:460px}.entry{max-width:430px;margin:0 auto 9px;height:56px;display:flex;align-items:center;justify-content:center;border:2px solid #5eead4;border-radius:16px;background:#fff;font-size:30px;font-weight:900}.entry.empty{color:#9ca3af;font-size:17px;font-weight:750}.pad{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{min-height:54px;border:1px solid #d1d5db;border-radius:15px;background:#fff;color:#111827;font-size:23px;font-weight:900;cursor:pointer;touch-action:manipulation}.pad .utility{color:#4b5563;background:#f9fafb}.pad .submit{background:var(--teal);color:#fff;border-color:var(--teal);font-size:18px}.message{text-align:center;font-size:14px;font-weight:850;min-height:21px;margin-top:7px}.message.error{color:#b91c1c}.message.good{color:#166534}.done{border:1px solid #a7f3d0;background:#ecfdf5;color:#065f46;border-radius:16px;padding:14px;text-align:center;font-weight:950}.help{color:#64748b;text-align:center;font-size:12px;margin-top:7px}@media(max-width:480px){.coach-card{padding:12px 9px}.coach-title{font-size:24px}.pad button{min-height:52px}.group-box{min-width:40px}.mult-cell{width:10px;height:10px}.ten-block{grid-template-columns:repeat(5,17px);grid-template-rows:repeat(2,17px)}.dot{width:17px;height:17px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.question-card{border:1px solid #99f6e4;background:#fff;border-radius:18px;padding:13px 11px;margin:7px 0}.focus-kicker{display:inline-block;border-radius:999px;padding:4px 10px;background:#ccfbf1;color:#115e59;font-size:11px;font-weight:950;letter-spacing:.04em}.focus-fact{font-size:clamp(38px,9vw,58px);line-height:1.1;text-align:center;font-weight:950;letter-spacing:-.035em;margin:10px 0 8px}.focus-note{text-align:center;color:#64748b;font-size:12px;font-weight:750;margin:0 0 8px}.good-flash{border-color:#34d399!important;background:#ecfdf5!important;transform:scale(1.01)}
</style></head><body><div id="root" class="wrap"></div><script>(() => {
let args={},state=null,digits='',timers=[],lastHeight=0;
const post=(type,extra={})=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),'*');
const ready=()=>post('streamlit:componentReady',{apiVersion:1});
const setValue=value=>post('streamlit:setComponentValue',{value,dataType:'json'});
const setHeight=()=>requestAnimationFrame(()=>{const h=Math.ceil(document.documentElement.scrollHeight+8);if(h!==lastHeight){lastHeight=h;post('streamlit:setFrameHeight',{height:h})}});
const esc=v=>String(v==null?'':v).replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};
const later=(ms,fn)=>timers.push(setTimeout(fn,ms));
const storageId=()=>`tdfc-alt-focus:${String(args.session_key||'session')}`;
function initialPhase(){const first=(args.items||[])[0];return first&&first.start_phase==='coach'?'coach':'question'}
function fresh(){return {index:0,phase:initialPhase(),events:[],itemStartedAt:Date.now(),retryMissed:false,completePayload:null,coachStartedAt:0}}
function save(){try{sessionStorage.setItem(storageId(),JSON.stringify(state))}catch(_){}}
function load(){try{const raw=sessionStorage.getItem(storageId());if(!raw)return fresh();const x=JSON.parse(raw);return Object.assign(fresh(),x,{events:Array.isArray(x.events)?x.events:[]})}catch(_){return fresh()}}
function current(){return (args.items||[])[state.index]||null}
function attemptsFor(item){return state.events.filter(e=>Number(e.activity_index)===Number(item.activity_index))}
function eventId(item,n){return `${String(args.session_key||'focus')}:${Number(item.activity_index)}:${Number(item.attempt_offset||0)+n}`}
function progress(){const total=(args.items||[]).length||1,done=Math.min(state.index,total),pct=Math.round(done/total*100);return `<div class="topline"><span>Step 3 · Your Focus Practice</span><span>${Math.min(state.index+1,total)} of ${total}</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div>`}
function dots(n,cls){let out='';for(let i=0;i<n;i++)out+=`<span class="counter ${cls}"></span>`;return out}
function frameCells(base,move,role){let out='';for(let i=0;i<10;i++){let c='dot';if(role==='target'){if(i<base)c+=' base';else if(i<base+move)c+=' target-move'}else{if(i<base)c+=' base';else if(i<base+move)c+=' source-move'}out+=`<span class="${c}"></span>`}return out}
function numberLine(v){const start=Number(v.start),end=Number(v.end),delta=Number(v.delta||0);let lo=Math.min(start,end)-2,hi=Math.max(start,end)+2;if(hi-lo<6){const extra=6-(hi-lo);lo-=Math.floor(extra/2);hi+=Math.ceil(extra/2)}lo=Math.max(-20,lo);hi=Math.min(20,hi);const span=Math.max(1,hi-lo);const pct=x=>3+94*((x-lo)/span);let ticks='';for(let x=lo;x<=hi;x++){const show=(hi-lo<=14)||x===start||x===end||x===0||x%2===0;if(!show)continue;ticks+=`<span class="tick" style="left:${pct(x)}%"></span><span class="tick-label" style="left:${pct(x)}%">${x}</span>`}const dir=delta>0?'right':delta<0?'left':'nowhere',arrow=delta>0?'→':delta<0?'←':'';return `<div class="number-line"><div class="move-arrow">${delta===0?'Stay here':`${arrow} Move ${Math.abs(delta)} ${dir}`}</div><div class="axis"></div>${ticks}<div class="walker" style="left:${pct(start)}%;--end-left:${pct(end)}%">${start}</div></div>`}
function visualMarkup(m){const v=m.visual||{};switch(m.visual_type){case'ten_frame':return `<div class="ten-pair"><div><div class="ten-block">${frameCells(Number(v.target),Number(v.move),'target')}</div><div class="frame-label">${v.target} → 10</div></div><div><div class="ten-block">${frameCells(Number(v.remainder),Number(v.move),'source')}</div><div class="frame-label">break apart ${v.source}</div></div></div><div class="make-ten-eq">10 + ${v.remainder} = ${v.total}</div>`;case'double':return `<div class="counter-groups"><div class="counter-group">${dots(Number(v.value),'first')}</div><div class="counter-group">${dots(Number(v.value),'second')}</div></div>`;case'near_double':return `<div class="counter-groups"><div class="counter-group">${dots(Number(v.base),'first')}</div><div class="counter-group">${dots(Number(v.base),'second')}${dots(Number(v.extra),'extra')}</div></div>`;case'counters':{const gs=Array.isArray(v.groups)?v.groups:[];return `<div class="counter-groups">${gs.map((n,i)=>`<div class="counter-group">${dots(Number(n),i===0?'first':'second')}</div>`).join('')}</div>`}case'part_whole':{const total=Math.max(1,Number(v.total)),known=Number(v.known),unknown=Number(v.unknown);const kp=Math.max(0,Math.min(100,known/total*100));return `<div class="bar-shell"><div class="whole-label">Whole = ${total}</div><div class="bar"><div class="bar-known" style="width:${kp}%">${known}</div><div class="bar-unknown" style="width:${100-kp}%"><span>${unknown}</span></div></div><div class="missing-eq">${known} + ? = ${total}</div></div>`}case'equal_groups':{let boxes='';for(let g=0;g<Number(v.groups);g++){let ds='';for(let i=0;i<Number(v.size);i++)ds+='<span class="group-dot"></span>';boxes+=`<div class="group-box">${ds}</div>`}return `<div class="groups-grid">${boxes}</div><div class="make-ten-eq">${v.groups} groups × ${v.size} = ${v.total}</div>`}case'integer_line':case'number_line':return numberLine(v);case'multiplication_array':{const rows=Number(v.visual_groups||v.groups||1),cols=Number(v.size||1),mode=String(v.visual_mode||'direct');let cells='';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){let cls='mult-cell';if(mode==='split_add')cls+=r<Number(v.first_groups||0)?' part-a':' part-b';else if(mode==='split_subtract')cls+=r<Number(v.groups||0)?' part-a':' removed';cells+=`<span class="${cls}"></span>`}}return `<div class="mult-array" style="grid-template-columns:repeat(${cols},12px)">${cells}</div>`}default:return''}}
function modelMarkup(item){const m=item.model||{},steps=(m.steps||[]).map(x=>`<div class="step">${esc(x)}</div>`).join('');return `<div id="coach" class="coach-card"><div class="stage-row"><span class="stage-chip see">SEE IT</span><span class="stage-chip connect">CONNECT IT</span><span class="stage-chip turn">YOUR TURN</span></div><div class="coach-title">${esc(m.title||'Build the idea')}</div><div class="coach-sub">${esc(item.prompt)}</div><div class="watch-controls"><button id="watch" class="watch-btn primary" type="button">▶ WATCH IT</button><button id="replay" class="watch-btn secondary" type="button">↻ REPLAY</button></div><div class="visual">${visualMarkup(m)}</div><div class="relationship">${esc(m.relationship||'')}</div><div class="steps">${steps}</div><div class="final-eq">${esc(m.final_equation||'')}</div><div class="continue-wrap"><button id="to-retry" class="continue" type="button">TRY AGAIN →</button></div></div>`}
function keypad(){return `<div id="entry" class="entry ${digits?'':'empty'}">${digits?esc(digits):'Tap your answer'}</div><div class="pad"><button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button id="minus" class="utility">−</button><button data-digit="0">0</button><button id="submit" class="submit">✓</button><button id="erase" class="utility" style="grid-column:1/4">⌫ Delete</button></div><div id="message" class="message ${state.retryMissed?'error':''}">${state.retryMissed?'Almost — use the model and try once more.':''}</div><div class="help">Tap numbers, then ✓</div>`}
function questionMarkup(item){return `<div class="question-card"><div class="focus-kicker">🎯 FOCUS FACT</div><div class="focus-fact">${esc(item.prompt)} = ?</div><div class="focus-note">${esc(item.focus_reason||'Build fluency')}</div>${keypad()}</div>`}
function retryMarkup(item){const m=item.model||{};return `<div class="retry-card"><div class="boss-chip">🎯 TRY AGAIN</div><div class="boss-fact">${esc(item.prompt)} = ?</div><div class="boss-hint">${esc(m.recap||m.final_equation||'Use the model you just built.')}</div>${keypad()}</div>`}
function render(){clearTimers();if(!args||!Array.isArray(args.items)||!args.items.length)return;if(!state)state=load();if(state.completePayload){setValue(state.completePayload);document.getElementById('root').innerHTML='<div class="done">✅ Focus Practice complete! Saving…</div>';setHeight();return}if(state.index>=args.items.length){finish();return}const item=current();const body=state.phase==='coach'?modelMarkup(item):(state.phase==='retry'?retryMarkup(item):questionMarkup(item));document.getElementById('root').innerHTML=progress()+`<div class="topline" style="margin-top:-3px"><span></span><span class="domain">${esc(item.domain)}</span></div>`+body;bind();resumeSequence();setHeight()}
function sequenceTimes(){const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;return reduce?[10,20,30]:[180,1050,2050]}
function resumeSequence(){const card=document.getElementById('coach');if(!card||state.phase!=='coach')return;const started=Number(state.coachStartedAt||0);if(!started)return;clearTimers();card.classList.remove('seq-see','seq-connect','seq-turn','sequence-complete','sequence-playing');const [a,b,c]=sequenceTimes(),elapsed=Math.max(0,Date.now()-started);if(elapsed>=a)card.classList.add('seq-see');if(elapsed>=b)card.classList.add('seq-connect');if(elapsed>=c){card.classList.add('seq-turn','sequence-complete');card.classList.remove('sequence-playing');setHeight();return}card.classList.add('sequence-playing');if(elapsed<a)later(a-elapsed,()=>{const x=document.getElementById('coach');if(x){x.classList.add('seq-see');setHeight()}});if(elapsed<b)later(b-elapsed,()=>{const x=document.getElementById('coach');if(x){x.classList.add('seq-see','seq-connect');setHeight()}});if(elapsed<c)later(c-elapsed,()=>{const x=document.getElementById('coach');if(x){x.classList.add('seq-see','seq-connect','seq-turn','sequence-complete');x.classList.remove('sequence-playing');setHeight()}});setHeight()}
function startSequence(force=false){if(!document.getElementById('coach'))return;const started=Number(state&&state.coachStartedAt||0),[a,b,c]=sequenceTimes(),elapsed=started?Math.max(0,Date.now()-started):0;if(!force&&started&&elapsed<c){resumeSequence();return}state.coachStartedAt=Date.now();save();resumeSequence()}
function bind(){const watch=document.getElementById('watch');if(watch){const go=e=>{if(e&&e.cancelable)e.preventDefault();startSequence(false)};watch.addEventListener('pointerup',go,{passive:false});watch.addEventListener('touchend',go,{passive:false});watch.addEventListener('click',go)}const replay=document.getElementById('replay');if(replay)replay.addEventListener('click',()=>startSequence(true));const next=document.getElementById('to-retry');if(next)next.addEventListener('click',()=>{state.phase='retry';state.retryMissed=false;state.coachStartedAt=0;digits='';state.itemStartedAt=Date.now();save();render()});document.querySelectorAll('[data-digit]').forEach(b=>b.addEventListener('click',()=>addDigit(b.dataset.digit)));const minus=document.getElementById('minus');if(minus)minus.addEventListener('click',toggleMinus);const eraseBtn=document.getElementById('erase');if(eraseBtn)eraseBtn.addEventListener('click',erase);const submitBtn=document.getElementById('submit');if(submitBtn)submitBtn.addEventListener('click',submit)}
function updateEntry(){const el=document.getElementById('entry');if(!el)return;el.textContent=digits||'Tap your answer';el.className=digits?'entry':'entry empty';const msg=document.getElementById('message');if(msg&&state.retryMissed){msg.textContent='';msg.className='message';state.retryMissed=false;save()}setHeight()}
function addDigit(d){if(!['question','retry'].includes(state.phase))return;const neg=digits.startsWith('-'),body=neg?digits.slice(1):digits;if(body.length>=3)return;digits=(neg?'-':'')+(body+d).replace(/^0+(?=\d)/,'');updateEntry()}
function toggleMinus(){if(!['question','retry'].includes(state.phase))return;digits=digits.startsWith('-')?digits.slice(1):('-'+digits);updateEntry()}
function erase(){if(!['question','retry'].includes(state.phase))return;digits=digits.slice(0,-1);updateEntry()}
function record(item,value,isRetry){const n=attemptsFor(item).length+1;state.events.push({client_event_id:eventId(item,n),activity_index:Number(item.activity_index),student_answer:value,response_seconds:Math.max(0,(Date.now()-Number(state.itemStartedAt||Date.now()))/1000),is_retry:!!isRetry})}
function submit(){if(!['question','retry'].includes(state.phase))return;const value=Number(digits),msg=document.getElementById('message');if(!digits||digits==='-'||!Number.isInteger(value)||value<-999||value>999){if(msg){msg.textContent='Enter a whole-number answer.';msg.className='message error'}return}const item=current(),isRetry=state.phase==='retry';record(item,value,isRetry);digits='';if(value===Number(item.correct_answer)){state.index+=1;const next=current();state.phase=next&&next.start_phase==='coach'?'coach':'question';state.retryMissed=false;state.coachStartedAt=0;state.itemStartedAt=Date.now();save();if(state.index>=args.items.length){finish();return}render();return}if(isRetry){state.retryMissed=true;state.itemStartedAt=Date.now();save();render();return}state.phase='coach';state.retryMissed=false;state.coachStartedAt=0;state.itemStartedAt=Date.now();save();render()}
function finish(){const payload={status:'complete',events:state.events};state.completePayload=payload;save();setValue(payload);document.getElementById('root').innerHTML='<div class="done">✅ Focus Practice complete! Saving…</div>';setHeight()}
document.addEventListener('keydown',e=>{if(!args||!state||!['question','retry'].includes(state.phase))return;if(e.key>='0'&&e.key<='9'){e.preventDefault();addDigit(e.key)}else if(e.key==='-'){e.preventDefault();toggleMinus()}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();erase()}else if(e.key==='Enter'){e.preventDefault();submit()}})
window.addEventListener('message',e=>{if(!e.data||e.data.type!=='streamlit:render')return;const newArgs=e.data.args||{},newKey=String(newArgs.session_key||'session'),oldKey=String(args.session_key||'');args=newArgs;if(!state||newKey!==oldKey){state=load();digits=''}render()});ready();setHeight();
})();</script></body></html>
